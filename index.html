<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Güneş Mobilya — Muhasebe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== BULUT AYARI =====
   Supabase projesinin adresi ve "anon public" anahtarı buraya yazılır.
   Boş kalırsa uygulama sadece bu cihazda (çevrimdışı) çalışır. */
var BULUT = {
  adres:   "",
  anahtar: ""
};
</script>
<style>
:root{
  --bg:#f6f5f2; --kart:#ffffff; --yazi:#1c1917; --soluk:#78716c; --cizgi:#e7e5e4; --hafif:#fafaf9;
  --ana:#d97706; --ana-koyu:#b45309; --ana-acik:#fef3c7;
  --giris:#15803d; --giris-acik:#ecfdf3;
  --cikis:#c2410c; --cikis-acik:#fff1ea;
  --borc:#1d4ed8; --borc-acik:#eef4ff;
  --golge:0 1px 2px rgba(28,25,23,.04),0 1px 3px rgba(28,25,23,.06);
  --yan:232px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{background:var(--bg);color:var(--yazi);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom));}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;}
svg.ik{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* --- Üst çubuk --- */
.ust{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--cizgi);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;min-height:58px;}
.ust h1{font-size:17px;margin:0;flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ikon-buton{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:none;border:1px solid var(--cizgi);border-radius:10px;height:36px;min-width:36px;padding:0 10px;color:var(--yazi);font-size:14px;font-weight:500;}
.ikon-buton:hover{background:var(--hafif);}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;}
.logo .gunes{width:30px;height:30px;border-radius:9px;background:var(--ana-acik);color:var(--ana);display:flex;align-items:center;justify-content:center;}
.durum{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--soluk);}
.durum i{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;}
.durum.yerel i{background:#a8a29e;}

.sayfa{max-width:960px;margin:0 auto;padding:16px;}

/* --- Kartlar --- */
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--golge);}
.kart-baslik{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soluk);font-weight:500;margin:0 0 4px;}
.buyuk-sayi{font-size:30px;font-weight:700;letter-spacing:-.6px;margin:2px 0 0;font-variant-numeric:tabular-nums;}
.alt-bilgi{color:var(--soluk);font-size:13px;margin-top:4px;}
.alt-bilgi b{color:var(--yazi);font-weight:600;}
.izgara{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:12px;}
.izgara .kart{margin:0;}
.ozet .deger{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;}
.nokta{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

/* --- İşlem butonları --- */
.islemler{display:grid;gap:10px;grid-template-columns:1fr;margin-bottom:12px;}
.islem{display:flex;align-items:center;gap:12px;width:100%;background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:14px;text-align:left;box-shadow:var(--golge);transition:border-color .15s,transform .1s;}
.islem:hover{border-color:#d6d3d1;}
.islem:active{transform:scale(.99);}
.islem .rozet{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
.islem .rozet svg{width:22px;height:22px;}
.islem b{display:block;font-size:15px;font-weight:600;}
.islem small{display:block;font-size:13px;color:var(--soluk);}
.islem .ok{margin-left:auto;color:#a8a29e;}
.r-giris{background:var(--giris-acik);color:var(--giris);}
.r-cikis{background:var(--cikis-acik);color:var(--cikis);}
.r-borc{background:var(--borc-acik);color:var(--borc);}
.r-ana{background:var(--ana-acik);color:var(--ana-koyu);}

/* --- Form --- */
.buton{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:11px;padding:13px 16px;font-size:15px;font-weight:600;color:#fff;background:var(--yazi);margin-top:16px;transition:filter .15s;}
.buton:hover{filter:brightness(1.12);}
.buton:disabled{opacity:.55;cursor:wait;}
.buton.ikincil{background:#fff;color:var(--yazi);border:1px solid var(--cizgi);}
.buton.ikincil:hover{background:var(--hafif);filter:none;}
.buton.tehlike{background:#fff;color:#b91c1c;border:1px solid #fecaca;}
.buton.tehlike:hover{background:#fef2f2;filter:none;}
.buton-sira{display:flex;gap:10px;}
.buton-sira .buton{margin-top:0;}
label.etiket{display:block;font-weight:500;margin:16px 0 6px;font-size:14px;}
label.etiket .ist{font-weight:400;color:var(--soluk);}
.kutu{width:100%;border:1px solid #d6d3d1;border-radius:10px;padding:11px 12px;background:#fff;font-size:16px;}
.kutu:focus{outline:none;border-color:var(--ana);box-shadow:0 0 0 3px rgba(217,119,6,.15);}
.tutar-kutu{font-size:28px;font-weight:600;padding:12px 14px;font-variant-numeric:tabular-nums;}
.secenekler{display:flex;flex-wrap:wrap;gap:8px;}
.secenek{border:1px solid var(--cizgi);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:#44403c;}
.secenek:hover{border-color:#d6d3d1;background:var(--hafif);}
.secenek.secili{border-color:var(--yazi);background:var(--yazi);color:#fff;}
.hata{color:#b91c1c;font-size:14px;font-weight:500;margin-top:10px;min-height:1px;}
.form-kart{max-width:560px;}

/* --- Listeler --- */
.satir{display:flex;align-items:center;gap:12px;padding:11px 2px;border:0;border-bottom:1px solid #f0eeec;width:100%;background:none;text-align:left;}
.satir:last-child{border-bottom:0;}
button.satir:hover{background:var(--hafif);}
.satir .rozet{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.satir .rozet svg{width:18px;height:18px;}
.satir .orta{flex:1;min-width:0;}
.satir .s1{font-weight:500;font-size:15px;}
.satir .s2{color:var(--soluk);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.satir .tutar{font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.t-giris{color:var(--giris);} .t-cikis{color:var(--cikis);} .t-borc{color:var(--borc);} .t-soluk{color:var(--soluk);font-weight:500;}
.gun-baslik{display:flex;justify-content:space-between;font-weight:500;color:var(--soluk);font-size:13px;margin:16px 2px 6px;}
.liste-kart{padding:4px 14px;}
.bilgi-satir{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #f0eeec;}
.bilgi-satir:last-child{border-bottom:0;}
.bilgi-satir span{color:var(--soluk);}
.bilgi-satir b{font-weight:500;text-align:right;}

.ay-sec{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.ay-sec strong{font-size:16px;font-weight:600;min-width:130px;text-align:center;}
.filtre{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}

.cubuk-satir{margin:12px 0;}
.cubuk-ust{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;}
.cubuk-ust .t-soluk{font-size:13px;}
.cubuk-yol{height:8px;background:#f2f0ee;border-radius:4px;overflow:hidden;}
.cubuk{height:100%;border-radius:4px;}

.bos{text-align:center;color:var(--soluk);padding:28px 10px;font-size:14px;}
.bos svg{width:32px;height:32px;color:#d6d3d1;display:block;margin:0 auto 8px;}
.ara{position:relative;margin-bottom:12px;}
.ara svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--soluk);width:18px;height:18px;}
.ara input{padding-left:38px;}
.uyari{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:14px;}
.uyari a{color:inherit;font-weight:600;}
.tel{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:var(--borc);font-weight:500;text-decoration:none;font-size:14px;}
.tel svg{width:16px;height:16px;}
.basliksiz{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;}
.basliksiz h2{font-size:15px;font-weight:600;margin:0;}
.basliksiz a{font-size:14px;color:var(--ana-koyu);text-decoration:none;font-weight:500;}

/* --- Menü: telefonda altta, bilgisayarda solda --- */
.menu{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--cizgi);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
.menu .logo{display:none;}
.menu button{flex:1;border:0;background:none;padding:9px 4px 10px;font-size:11.5px;font-weight:500;color:var(--soluk);display:flex;flex-direction:column;align-items:center;gap:3px;}
.menu button.aktif{color:var(--ana-koyu);}
.menu button.aktif svg{stroke-width:2.2;}
.menu .menu-alt{display:none;}

@media(min-width:900px){
  body{padding-bottom:0;padding-left:var(--yan);}
  .menu{top:0;right:auto;width:var(--yan);flex-direction:column;border-top:0;border-right:1px solid var(--cizgi);padding:18px 12px;gap:2px;}
  .menu .logo{display:flex;padding:0 8px 18px;}
  .menu button{flex:none;flex-direction:row;gap:10px;font-size:14px;padding:10px 12px;border-radius:9px;color:#44403c;}
  .menu button:hover{background:var(--hafif);}
  .menu button.aktif{background:var(--ana-acik);color:var(--ana-koyu);}
  .menu .menu-alt{display:flex;margin-top:auto;}
  .sadece-mobil{display:none!important;}
  .ust{padding:14px 28px;}
  .ust .logo{display:none;}
  .sayfa{padding:24px 28px;}
  .izgara.dort{grid-template-columns:repeat(4,1fr);}
  .islemler{grid-template-columns:repeat(3,1fr);}
  .iki-sutun{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .bildirim{bottom:28px!important;}
}
@media(min-width:600px) and (max-width:899px){ .izgara.dort{grid-template-columns:repeat(4,1fr);} }
@media(max-width:599px){ .izgara.dort .kasa,.izgara.dort > :last-child{grid-column:1 / -1;} }

/* --- Bildirim & onay --- */
.bildirim{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--yazi);color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;font-weight:500;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:gel .2s ease;max-width:90vw;display:flex;align-items:center;gap:8px;}
.bildirim svg{width:18px;height:18px;color:#86efac;}
@keyframes gel{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
.perde{position:fixed;inset:0;background:rgba(28,25,23,.4);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:solma .15s ease;}
@keyframes solma{from{opacity:0;}to{opacity:1;}}
.pencere{background:#fff;border-radius:16px;padding:20px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.pencere p{font-size:16px;font-weight:600;margin:0 0 4px;}
.pencere .buton-sira{margin-top:18px;}

/* --- Giriş ekranı --- */
.giris-ekrani{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.giris-ekrani .kart{width:100%;max-width:380px;padding:28px 24px;}
.giris-ekrani .logo{justify-content:center;font-size:18px;margin-bottom:4px;}
.giris-ekrani .logo .gunes{width:38px;height:38px;}
.yukleniyor{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--soluk);gap:10px;}
.donen{width:18px;height:18px;border:2px solid var(--cizgi);border-top-color:var(--ana);border-radius:50%;animation:don .7s linear infinite;}
@keyframes don{to{transform:rotate(360deg);}}
body.girissiz{padding:0;}
body.girissiz .menu{display:none;}
</style>
</head>
<body>
<nav class="menu" id="menu">
  <div class="logo"><span class="gunes" data-ik="gunes"></span>Güneş Mobilya</div>
  <button data-git="ana"><span data-ik="ev"></span>Ana Sayfa</button>
  <button data-git="musteriler"><span data-ik="kisiler"></span>Müşteriler</button>
  <button data-git="gecmis"><span data-ik="liste"></span>Kayıtlar</button>
  <button data-git="rapor"><span data-ik="grafik"></span>Rapor</button>
  <button data-git="ayarlar" class="menu-alt"><span data-ik="ayar"></span>Ayarlar</button>
</nav>
<div id="uygulama"></div>

<script>
"use strict";
/* ================= SİMGELER ================= */
var IK = {
  gunes:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  ev:'<path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  kisiler:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  kisi:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
  liste:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  grafik:'<path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>',
  ayar:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  asagi:'<path d="M12 5v14M19 12l-7 7-7-7"/>',
  yukari:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  defter:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  sol:'<path d="m15 18-6-6 6-6"/>', sag:'<path d="m9 18 6-6-6-6"/>',
  sil:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  kalem:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  telefon:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  indir:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  yukle:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  ara:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  cikis:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  tamam:'<path d="M20 6 9 17l-5-5"/>',
  arti:'<path d="M12 5v14M5 12h14"/>',
  para:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  bulut:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>'
};
function ik(ad){ return '<svg class="ik" viewBox="0 0 24 24" aria-hidden="true">' + IK[ad] + '</svg>'; }
document.querySelectorAll("[data-ik]").forEach(function(e){ e.outerHTML = ik(e.getAttribute("data-ik")); });

/* ================= SABİTLER ================= */
var GIRIS_TURLERI = ["Satış", "Peşinat", "Tahsilat", "Diğer"];
var CIKIS_TURLERI = ["Malzeme", "Kira", "Maaş", "Elektrik / Su", "Nakliye", "Yemek", "Vergi", "Diğer"];
var ODEME = ["Nakit", "Kart", "Havale"];
var AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var YEREL_ANAHTAR = "gunes_muhasebe_v1";
var FORM_EKRANLARI = {giris:1, cikis:1, yenimusteri:1, borc:1, tahsilat:1};

/* ================= DEPO (bulut veya bu cihaz) ================= */
var cevrimici = !!(BULUT.adres && BULUT.anahtar);
var sb = cevrimici && window.supabase ? window.supabase.createClient(BULUT.adres, BULUT.anahtar) : null;
var veri = {hareketler:[], musteriler:[]};
var oturum = null;

function yerelOku(){
  try{
    var v = JSON.parse(localStorage.getItem(YEREL_ANAHTAR));
    if(v && Array.isArray(v.hareketler) && Array.isArray(v.musteriler)) return v;
  }catch(e){}
  return {hareketler:[], musteriler:[]};
}
function yerelYaz(v){ try{ localStorage.setItem(YEREL_ANAHTAR, JSON.stringify(v)); }catch(e){ throw new Error("Bu cihazda kayıt yapılamadı."); } }
function ayarOku(k){ try{ return localStorage.getItem("gunes_" + k); }catch(e){ return null; } }
function ayarYaz(k, v){ try{ localStorage.setItem("gunes_" + k, v); }catch(e){} }

// Bulut tablolarında sütunlar alt_çizgili (musteri_id); uygulamada musteriId.
function bulutaCevir(tablo, k){
  if(tablo === "musteriler") return {id:k.id, ad:k.ad, telefon:k.telefon || "", adres:k.adres || "", olusma:k.olusma || Date.now()};
  return {id:k.id, tur:k.tur, tutar:k.tutar, kategori:k.kategori, odeme:k.odeme || null, aciklama:k.aciklama || "",
    musteri_id:k.musteriId || null, tarih:k.tarih, olusma:k.olusma};
}
function buluttanCevir(tablo, r){
  if(tablo === "musteriler") return {id:r.id, ad:r.ad, telefon:r.telefon || "", adres:r.adres || "", olusma:Number(r.olusma) || 0};
  return {id:r.id, tur:r.tur, tutar:Number(r.tutar), kategori:r.kategori, odeme:r.odeme, aciklama:r.aciklama || "",
    musteriId:r.musteri_id || null, tarih:r.tarih, olusma:Number(r.olusma) || 0};
}
function bellegeYaz(tablo, k){
  var l = veri[tablo];
  for(var i=0;i<l.length;i++) if(l[i].id === k.id){ l[i] = k; return; }
  l.push(k);
}

var Depo = {
  yukle: async function(){
    if(!cevrimici){ veri = yerelOku(); return; }
    var sonuc = {hareketler:[], musteriler:[]};
    for(var tablo in sonuc){
      for(var bas = 0; ; bas += 1000){
        var r = await sb.from(tablo).select("*").order("id").range(bas, bas + 999);
        if(r.error) throw r.error;
        r.data.forEach(function(x){ sonuc[tablo].push(buluttanCevir(tablo, x)); });
        if(r.data.length < 1000) break;
      }
    }
    veri = sonuc;
  },
  kaydet: async function(tablo, kayitlar){
    if(!Array.isArray(kayitlar)) kayitlar = [kayitlar];
    if(cevrimici){
      var r = await sb.from(tablo).upsert(kayitlar.map(function(k){ return bulutaCevir(tablo, k); }));
      if(r.error) throw r.error;
      kayitlar.forEach(function(k){ bellegeYaz(tablo, k); });
    }else{
      kayitlar.forEach(function(k){ bellegeYaz(tablo, k); });
      yerelYaz(veri);
    }
  },
  sil: async function(tablo, id){
    if(cevrimici){
      var r = await sb.from(tablo).delete().eq("id", id);
      if(r.error) throw r.error;
    }
    veri[tablo] = veri[tablo].filter(function(x){ return x.id !== id; });
    if(!cevrimici) yerelYaz(veri);
  }
};

function hataMesaji(e){
  var m = (e && (e.message || e.error_description)) || String(e);
  if(/fetch|network|Failed/i.test(m)) return "İnternet bağlantısı yok gibi görünüyor. Tekrar deneyin.";
  if(/JWT|auth|permission|row-level/i.test(m)) return "Oturum süresi doldu. Lütfen tekrar giriş yapın.";
  return "Bir sorun oldu: " + m;
}
// Kaydet butonlarında: çift tıklamayı engeller, hatayı gösterir.
async function islem(btn, fn){
  if(btn) btn.disabled = true;
  try{ await fn(); }
  catch(e){ var h = document.getElementById("hata"); if(h) h.textContent = hataMesaji(e); else alert(hataMesaji(e)); }
  finally{ if(btn && document.body.contains(btn)) btn.disabled = false; }
}

/* ================= YARDIMCI ================= */
function yeniId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function para(n){
  var neg = n < 0; n = Math.abs(Math.round(n*100)/100);
  var tam = Math.floor(n), kurus = Math.round((n - tam)*100);
  var s = tam.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  if(kurus) s += "," + (kurus < 10 ? "0" : "") + kurus;
  return (neg ? "-" : "") + s + " ₺";
}
/* "12.500" , "12500,50" , "12.500,50" , "12500.5" hepsini anlar */
function sayiOku(s){
  s = String(s || "").replace(/[₺\s]/g, "");
  if(!s) return NaN;
  if(s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", ".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  return Number(s);
}
function tarihStr(d){ return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2); }
function bugun(){ return tarihStr(new Date()); }
function tarihYaz(t){
  if(t === bugun()) return "Bugün";
  var d = new Date(); d.setDate(d.getDate()-1);
  if(t === tarihStr(d)) return "Dün";
  var p = t.split("-"); return Number(p[2]) + " " + AYLAR[Number(p[1])-1] + " " + p[0];
}
function musteriBul(id){ for(var i=0;i<veri.musteriler.length;i++) if(veri.musteriler[i].id === id) return veri.musteriler[i]; return null; }
function hareketBul(id){ for(var i=0;i<veri.hareketler.length;i++) if(veri.hareketler[i].id === id) return veri.hareketler[i]; return null; }
function musteriBorcu(id){
  var t = 0;
  veri.hareketler.forEach(function(h){
    if(h.musteriId !== id) return;
    if(h.tur === "borc") t += h.tutar; else if(h.tur === "giris") t -= h.tutar;
  });
  return Math.round(t*100)/100;
}
function kasa(){
  var nakit = 0, banka = 0;
  veri.hareketler.forEach(function(h){
    if(h.tur === "borc") return;
    var k = h.tur === "giris" ? h.tutar : -h.tutar;
    if(h.odeme === "Nakit") nakit += k; else banka += k;
  });
  return {nakit:nakit, banka:banka, toplam:nakit+banka};
}
function sirali(liste){
  return liste.slice().sort(function(a,b){ return a.tarih < b.tarih ? 1 : a.tarih > b.tarih ? -1 : (b.olusma||0) - (a.olusma||0); });
}

function bildir(yazi){
  document.querySelectorAll(".bildirim").forEach(function(x){ x.remove(); });
  var e = document.createElement("div"); e.className = "bildirim"; e.innerHTML = ik("tamam") + esc(yazi);

}

function ekranAna(){

  veri.hareketler.forEach(function(h){
    if(h.tarih !== bg) return;

  });

    '</div>' +
    '<div class="islemler">' +
      islemButonu("giris", "r-giris", "asagi", "Para Girdi", "Satış, peşinat, tahsilat") +
      islemButonu("cikis", "r-cikis", "yukari", "Para Çıktı", "Malzeme, kira, maaş, fatura") +
      islemButonu("musteriler", "r-borc", "defter", "Veresiye Defteri", "Müşteri borçları ve ödemeler") +
    '</div>' +
    '<div class="basliksiz"><h2>Son kayıtlar</h2>' + (veri.hareketler.length > 6 ? '<a href="#gecmis">Tümünü gör</a>' : '') + '</div>' +
    '<div class="kart liste-kart">' + (son.length ? son.map(function(h){ return satirHareket(h); }).join("") :
      '<div class="bos">' + ik("liste") + 'Henüz kayıt yok. Başlamak için “Para Girdi” veya “Para Çıktı”ya dokunun.</div>') + '</div>';
  return {baslik:"Güneş Mobilya", html:html};

function islemButonu(yer, renk, ikon, baslik, alt){
  return '<button class="islem" onclick="git(\'' + yer + '\')"><span class="rozet ' + renk + '">' + ik(ikon) + '</span>' +
    '<span><b>' + baslik + '</b><small>' + alt + '</small></span><span class="ok">' + ik("sag") + '</span></button>';
}
function yedekUyarisi(){
  if(cevrimici || !veri.hareketler.length) return "";
  var ilk = Math.min.apply(null, veri.hareketler.map(function(h){ return h.olusma || Date.now(); }));
  var son = Number(ayarOku("sonYedek")) || ilk;
  if((Date.now() - son) / 86400000 < 7) return "";
  return '<div class="uyari">Bilgiler sadece bu cihazda ve 1 haftadır yedek alınmadı. <a href="#ayarlar">Yedek al</a></div>';
}

function satirHareket(h, adGizle){
  var m = h.musteriId && !adGizle ? musteriBul(h.musteriId) : null;
  var ikon = h.tur === "giris" ? "asagi" : h.tur === "cikis" ? "yukari" : "defter";
  var isaret = h.tur === "giris" ? "+" : h.tur === "cikis" ? "−" : "";
  var baslik = h.tur === "borc" ? "Veresiye satış" : h.kategori;
  var alt = [m ? m.ad : "", h.aciklama, h.tur !== "borc" ? h.odeme : "", tarihYaz(h.tarih)].filter(Boolean).join(" · ");
  return '<button class="satir" onclick="git(\'kayit/' + h.id + '\')"><span class="rozet r-' + h.tur + '">' + ik(ikon) + '</span>' +
    '<span class="orta"><div class="s1">' + esc(baslik) + '</div><div class="s2">' + esc(alt) + '</div></span>' +

/* ================= KAYIT DETAYI ================= */
function ekranKayit(id){
  var h = hareketBul(id);

  '<div class="form-kart"><button class="buton tehlike" onclick="kayitSil(\'' + h.id + '\')">' + ik("sil") + 'Bu kaydı sil</button></div>';

    .sort(function(a,b){ return b.borc - a.borc || a.m.ad.localeCompare(b.m.ad, "tr"); });
  var toplam = 0, borclu = 0; liste.forEach(function(x){ if(x.borc > 0){ toplam += x.borc; borclu++; } });

      '<button class="islem" style="height:100%" onclick="git(\'yenimusteri\')"><span class="rozet r-ana">' + ik("arti") + '</span><span><b>Yeni müşteri</b><small>Ekle</small></span></button>' +

function musteriListesi(liste){

function musteriKaydet(btn, id){
  var ad = deger("ad");
  if(!ad){ document.getElementById("hata").textContent = "Lütfen müşterinin adını yazın."; return; }
  var kucuk = ad.toLocaleLowerCase("tr");

function ekranMusteri(id){
  var m = musteriBul(id);
  if(!m) return {baslik:"Müşteri", geri:true, html:'<div class="kart bos">Müşteri bulunamadı.</div>'};
  var borc = musteriBorcu(id);
  var hareket = sirali(veri.hareketler.filter(function(h){ return h.musteriId === id; }));
  var html = '<div class="iki-sutun"><div>' +
    '<div class="kart"><div class="kart-baslik">Kalan borç</div>' +
      '<div class="buyuk-sayi ' + (borc > 0 ? 't-borc' : 't-giris') + '">' + (borc > 0 ? para(borc) : borc < 0 ? "Fazla ödedi: " + para(-borc) : "Borcu yok") + '</div>' +
      (m.telefon ? '<a class="tel" href="tel:' + esc(m.telefon.replace(/[^\d+]/g,"")) + '">' + ik("telefon") + esc(m.telefon) + '</a>' : '') +
      (m.adres ? '<div class="alt-bilgi">' + esc(m.adres) + '</div>' : '') + '</div>' +
    '<div class="islemler" style="grid-template-columns:1fr">' +
      islemButonu("borc/" + id, "r-borc", "defter", "Veresiye sattım", "Borç yaz") +
      islemButonu("tahsilat/" + id, "r-giris", "asagi", "Ödeme aldım", "Borçtan düş") +
    '</div>' +
    '<div class="buton-sira" style="margin-bottom:12px"><button class="buton ikincil" onclick="git(\'yenimusteri/' + id + '\')">' + ik("kalem") + 'Düzenle</button>' +
    '<button class="buton tehlike" onclick="musteriSil(\'' + id + '\')">' + ik("sil") + 'Sil</button></div>' +
    '</div><div><div class="basliksiz"><h2>Hesap geçmişi</h2></div><div class="kart liste-kart">' +
      (hareket.length ? hareket.map(function(h){ return satirHareket(h, true); }).join("") : '<div class="bos">Henüz hareket yok.</div>') + '</div></div></div>';
  return {baslik:m.ad, geri:true, html:html};
}
function musteriSil(id){
  if(veri.hareketler.some(function(h){ return h.musteriId === id; })){
    onayla("Bu müşteri silinemez", "Müşterinin hesap geçmişinde kayıtlar var. Önce o kayıtları silmeniz gerekir.", "Tamam", function(){});
    return;
  }
  onayla("Müşteri silinsin mi?", "", "Sil", function(){
    islem(null, async function(){ await Depo.sil("musteriler", id); bildir("Müşteri silindi"); git("musteriler"); });
  });
}

function ekranBorc(id){
  var m = musteriBul(id); if(!m) return ekranMusteri(id);
  form = {odeme:"Nakit"};
  var html = '<div class="kart form-kart">' + tutarAlani("Satışın toplam tutarı") +
    '<label class="etiket" for="pesin">Peşin alınan <span class="ist">(yoksa boş bırakın)</span></label><input id="pesin" class="kutu" inputmode="decimal" autocomplete="off" placeholder="0 ₺">' +
    '<div id="pesinOdeme" style="display:none"><label class="etiket">Peşinat ödeme şekli</label>' + secenekler("odeme", ODEME, "Nakit") + '</div>' +
    '<div class="alt-bilgi" id="kalanYazi" style="font-size:14px;margin-top:10px"></div>' +
    notAlani("Örn: Yatak odası takımı", "Ne satıldı?") + tarihAlani() + '<div class="hata" id="hata"></div>' +
    '<button class="buton" style="background:var(--borc)" onclick="borcKaydet(this,\'' + id + '\')">' + ik("tamam") + 'Kaydet</button></div>';
  return {baslik:m.ad + " · Veresiye", geri:true, html:html, sonra:function(){
    secenekBagla();
    var t = document.getElementById("tutar"), p = document.getElementById("pesin");
    function guncelle(){
      var tv = sayiOku(t.value) || 0, pv = sayiOku(p.value) || 0;
      document.getElementById("pesinOdeme").style.display = pv > 0 ? "block" : "none";
      document.getElementById("kalanYazi").innerHTML = tv > 0 ? "Borca yazılacak: <b>" + para(Math.max(tv - pv, 0)) + "</b>" : "";
    }
    t.addEventListener("input", guncelle); p.addEventListener("input", guncelle); t.focus();
  }};
}
function borcKaydet(btn, id){
  var tutar = tutarAl("tutar"); if(tutar === null) return;
  var pesinYazi = deger("pesin"), pesin = pesinYazi ? sayiOku(pesinYazi) : 0;
  if(!(pesin >= 0) || pesin > tutar){ document.getElementById("hata").textContent = "Peşinat, toplam tutardan büyük olamaz."; return; }
  pesin = Math.round(pesin*100)/100;
  var aciklama = deger("aciklama"), tarih = deger("tarih") || bugun(), simdi = Date.now();
  var kayitlar = [{id:yeniId(), tur:"borc", tutar:tutar, kategori:"Veresiye", odeme:null, musteriId:id, aciklama:aciklama, tarih:tarih, olusma:simdi}];
  if(pesin > 0) kayitlar.push({id:yeniId(), tur:"giris", tutar:pesin, kategori:"Peşinat", odeme:form.odeme, musteriId:id, aciklama:aciklama, tarih:tarih, olusma:simdi+1});
  islem(btn, async function(){
    await Depo.kaydet("hareketler", kayitlar);
    bildir("Borca yazıldı: " + para(tutar - pesin)); geri();
  });
}

function ekranTahsilat(id){
  var m = musteriBul(id); if(!m) return ekranMusteri(id);
  form = {odeme:"Nakit"};
  var borc = musteriBorcu(id);
  var html = '<div class="kart form-kart">' +
    '<div class="kart-baslik">Kalan borç</div><div class="buyuk-sayi t-borc" style="font-size:24px;margin-bottom:16px">' + para(Math.max(borc,0)) + '</div>' +
    tutarAlani("Alınan tutar") +
    (borc > 0 ? '<div class="secenekler" style="margin-top:8px"><button type="button" class="secenek" onclick="document.getElementById(\'tutar\').value=\'' + String(borc).replace(".", ",") + '\'">Borcun tamamı</button></div>' : '') +
    '<label class="etiket">Ödeme şekli</label>' + secenekler("odeme", ODEME, "Nakit") +
    notAlani() + tarihAlani() + '<div class="hata" id="hata"></div>' +
    '<button class="buton" style="background:var(--giris)" onclick="tahsilatKaydet(this,\'' + id + '\')">' + ik("tamam") + 'Kaydet</button></div>';
  return {baslik:m.ad + " · Ödeme", geri:true, html:html, sonra:function(){ secenekBagla(); document.getElementById("tutar").focus(); }};
}
function tahsilatKaydet(btn, id){
  var tutar = tutarAl("tutar"); if(tutar === null) return;
  islem(btn, async function(){
    await Depo.kaydet("hareketler", {id:yeniId(), tur:"giris", tutar:tutar, kategori:"Tahsilat", odeme:form.odeme, musteriId:id,
      aciklama:deger("aciklama"), tarih:deger("tarih") || bugun(), olusma:Date.now()});
    bildir("Ödeme alındı: " + para(tutar)); geri();
  });
}

/* ================= KAYITLAR ================= */
function aySecici(){
  var p = ayGoster.split("-");
  return '<div class="ay-sec"><button class="ikon-buton" onclick="ayDegistir(-1)" aria-label="Önceki ay">' + ik("sol") + '</button>' +
    '<strong>' + AYLAR[Number(p[1])-1] + ' ' + p[0] + '</strong>' +
    '<button class="ikon-buton" onclick="ayDegistir(1)" aria-label="Sonraki ay">' + ik("sag") + '</button></div>';
}
function ayDegistir(n){
  var p = ayGoster.split("-"), d = new Date(Number(p[0]), Number(p[1]) - 1 + n, 1);
  ayGoster = d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2); ciz();
}
function filtreSec(f){ filtre = f; ciz(); }

function ekranGecmis(){
  var liste = sirali(veri.hareketler.filter(function(h){ return h.tarih.slice(0,7) === ayGoster && (filtre === "hepsi" || h.tur === filtre); }));
  var html = '<div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between">' + aySecici() +
    '<div class="filtre secenekler" style="margin-bottom:12px">' +
    [["hepsi","Hepsi"],["giris","Giren"],["cikis","Çıkan"],["borc","Veresiye"]].map(function(f){
      return '<button class="secenek' + (filtre === f[0] ? " secili" : "") + '" onclick="filtreSec(\'' + f[0] + '\')">' + f[1] + '</button>';
    }).join("") + '</div></div>';
  if(!liste.length) return {baslik:"Kayıtlar", html: html + '<div class="kart bos">' + ik("liste") + 'Bu ayda kayıt yok.</div>'};
  var gunler = {}, sira = [];
  liste.forEach(function(h){ if(!gunler[h.tarih]){ gunler[h.tarih] = []; sira.push(h.tarih); } gunler[h.tarih].push(h); });
  html += sira.map(function(t){
    var net = 0; gunler[t].forEach(function(h){ if(h.tur === "giris") net += h.tutar; else if(h.tur === "cikis") net -= h.tutar; });
    return '<div class="gun-baslik"><span>' + tarihYaz(t) + '</span><span>' + (net >= 0 ? "+" : "") + para(net) + '</span></div>' +
      '<div class="kart liste-kart">' + gunler[t].map(function(h){ return satirHareket(h); }).join("") + '</div>';
  }).join("");
  return {baslik:"Kayıtlar", html:html};
}

/* ================= RAPOR ================= */
function ekranRapor(){
  var gir = 0, cik = 0, veresiye = 0, giderler = {}, gelirler = {};
  veri.hareketler.forEach(function(h){
    if(h.tarih.slice(0,7) !== ayGoster) return;
    if(h.tur === "giris"){ gir += h.tutar; gelirler[h.kategori] = (gelirler[h.kategori]||0) + h.tutar; }
    else if(h.tur === "cikis"){ cik += h.tutar; giderler[h.kategori] = (giderler[h.kategori]||0) + h.tutar; }
    else if(h.tur === "borc") veresiye += h.tutar;
  });
  var net = gir - cik;
  var html = aySecici() +
    '<div class="izgara dort">' +
      '<div class="kart kasa"><div class="kart-baslik">' + (net >= 0 ? "Bu ay elde kalan" : "Bu ay çıkan, girenden fazla") + '</div>' +
        '<div class="buyuk-sayi ' + (net >= 0 ? "t-giris" : "t-cikis") + '">' + para(net) + '</div></div>' +
      '<div class="kart ozet"><div class="kart-baslik"><span><span class="nokta" style="background:var(--giris)"></span>Giren</span></div><div class="deger">' + para(gir) + '</div></div>' +
      '<div class="kart ozet"><div class="kart-baslik"><span><span class="nokta" style="background:var(--cikis)"></span>Çıkan</span></div><div class="deger">' + para(cik) + '</div></div>' +
      '<div class="kart ozet"><div class="kart-baslik"><span><span class="nokta" style="background:var(--borc)"></span>Veresiye satış</span></div><div class="deger">' + para(veresiye) + '</div></div>' +
    '</div><div class="iki-sutun">' +
    cubuklar("Para nereye gitti?", giderler, cik, "var(--cikis)") +
    cubuklar("Para nereden geldi?", gelirler, gir, "var(--giris)") + '</div>';
  return {baslik:"Rapor", html:html};
}
function cubuklar(baslik, obj, toplam, renk){
  var anahtar = Object.keys(obj).sort(function(a,b){ return obj[b] - obj[a]; });
  var govde = !anahtar.length ? '<div class="bos" style="padding:16px">Bu ay kayıt yok.</div>' : anahtar.map(function(k){
    var yuzde = toplam ? Math.round(obj[k] / toplam * 100) : 0;
    return '<div class="cubuk-satir" title="' + esc(k) + ': ' + para(obj[k]) + ' (%' + yuzde + ')"><div class="cubuk-ust"><span>' + esc(k) + '</span><span>' + para(obj[k]) +
      ' <span class="t-soluk">· %' + yuzde + '</span></span></div>' +
      '<div class="cubuk-yol"><div class="cubuk" style="width:' + Math.max(obj[k] / obj[anahtar[0]] * 100, 2) + '%;background:' + renk + '"></div></div></div>';
  }).join("");
  return '<div class="kart"><div class="kart-baslik" style="font-size:14px;color:var(--yazi);font-weight:600">' + baslik + '</div>' + govde + '</div>';
}

/* ================= AYARLAR / YEDEK ================= */
function ekranAyarlar(){
  var son = Number(ayarOku("sonYedek"));
  var eski = cevrimici ? yerelOku() : null;
  var html = '<div class="form-kart">';
  if(cevrimici){
    html += '<div class="kart"><div class="kart-baslik">Hesap</div><div style="font-weight:500">' + esc(kullaniciAdi()) + '</div>' +
      '<div class="alt-bilgi">Bilgiler bulutta saklanıyor. Telefon ve bilgisayarda aynı bilgiler görünür.</div>' +
      '<button class="buton ikincil" onclick="cikisYap()">' + ik("cikis") + 'Çıkış yap</button></div>';
    if(eski.hareketler.length || eski.musteriler.length){
      html += '<div class="kart"><div class="kart-baslik">Bu cihazdaki eski kayıtlar</div>' +
        '<div>Bu cihazda bulut öncesinden kalan <b>' + eski.hareketler.length + ' kayıt</b> ve <b>' + eski.musteriler.length + ' müşteri</b> var.</div>' +
        '<div class="hata" id="hata"></div><button class="buton" onclick="buluttaAktar(this)">' + ik("bulut") + 'Buluta aktar</button></div>';
    }
  }else{
    html += '<div class="uyari">Bilgiler şu an <b>sadece bu cihazda</b> saklanıyor. Telefon ve bilgisayardan birlikte kullanmak için bulut ayarı yapılmalı.</div>';
  }
  html += '<div class="kart"><div class="kart-baslik">Yedek</div>' +
    '<div>Tüm bilgileri bir dosya olarak indirir. Ara sıra yedek almak iyi olur.</div>' +
    '<div class="alt-bilgi">Son yedek: <b>' + (son ? tarihYaz(tarihStr(new Date(son))) : "Hiç alınmadı") + '</b></div>' +
    '<div class="buton-sira" style="margin-top:16px"><button class="buton" onclick="yedekAl()">' + ik("indir") + 'Yedek al</button>' +
    '<button class="buton ikincil" onclick="document.getElementById(\'yedekDosya\').click()">' + ik("yukle") + 'Geri yükle</button></div>' +
    '<input type="file" id="yedekDosya" accept=".json,application/json" style="display:none" onchange="yedekYukle(this)"></div>' +
    '<div class="kart"><div class="bilgi-satir"><span>Toplam kayıt</span><b>' + veri.hareketler.length + '</b></div>' +
    '<div class="bilgi-satir"><span>Toplam müşteri</span><b>' + veri.musteriler.length + '</b></div></div></div>';
  return {baslik:"Ayarlar", html:html};
}
function yedekAl(){
  var blob = new Blob([JSON.stringify({surum:1, tarih:new Date().toISOString(), hareketler:veri.hareketler, musteriler:veri.musteriler}, null, 1)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "gunes-mobilya-yedek-" + bugun() + ".json"; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  ayarYaz("sonYedek", Date.now()); bildir("Yedek dosyası indirildi"); ciz();
}
function yedekGecerli(v){
  return v && Array.isArray(v.hareketler) && Array.isArray(v.musteriler) &&
    v.hareketler.every(function(h){ return h && typeof h.id === "string" && /^(giris|cikis|borc)$/.test(h.tur) && Number(h.tutar) > 0 && /^\d{4}-\d{2}-\d{2}$/.test(h.tarih); }) &&
    v.musteriler.every(function(m){ return m && typeof m.id === "string" && typeof m.ad === "string"; });
}
function yedekYukle(input){
  var f = input.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    var v; try{ v = JSON.parse(r.result); }catch(e){}
    input.value = "";
    if(!yedekGecerli(v)){ onayla("Bu dosya bir yedek dosyası değil", "", "Tamam", function(){}); return; }
    var yazi = cevrimici ? "Yedekteki kayıtlar buluta eklenecek. Aynı kayıtlar varsa üzerine yazılır." : "Bu cihazdaki bilgilerin yerine yedekteki bilgiler gelecek.";
    onayla(v.hareketler.length + " kayıt ve " + v.musteriler.length + " müşteri yüklensin mi?", yazi, "Yükle", function(){
      islem(null, async function(){
        if(!cevrimici){ veri = {hareketler:[], musteriler:[]}; }
        await Depo.kaydet("musteriler", v.musteriler);
        await Depo.kaydet("hareketler", v.hareketler.map(function(h){ h.tutar = Number(h.tutar); return h; }));
        bildir("Yedek yüklendi"); git("ana");
      });
    });
  };
  r.readAsText(f);
}
function buluttaAktar(btn){
  var eski = yerelOku();
  islem(btn, async function(){
    await Depo.kaydet("musteriler", eski.musteriler);
    await Depo.kaydet("hareketler", eski.hareketler);
    try{ localStorage.removeItem(YEREL_ANAHTAR); }catch(e){}
    bildir("Eski kayıtlar buluta aktarıldı"); ciz();
  });
}

/* ================= GİRİŞ (sadece bulutta) ================= */
// Kullanıcı adı yazılırsa arkada "ad@gunesmobilya.app" e-postasına çevrilir.
function epostaYap(ad){ ad = ad.trim().toLocaleLowerCase("tr"); return ad.indexOf("@") >= 0 ? ad : ad + "@gunesmobilya.app"; }
function kullaniciAdi(){ var e = (oturum && oturum.user && oturum.user.email) || ""; return e.replace("@gunesmobilya.app", ""); }

function girisEkrani(mesaj){
  document.body.classList.add("girissiz");
  document.getElementById("uygulama").innerHTML =
    '<div class="giris-ekrani"><form class="kart" id="girisForm">' +
      '<div class="logo"><span class="gunes">' + ik("gunes") + '</span>Güneş Mobilya</div>' +
      '<div class="alt-bilgi" style="text-align:center;margin-bottom:8px">Muhasebe</div>' +
      '<label class="etiket" for="kadi">Kullanıcı adı</label><input id="kadi" class="kutu" autocomplete="username" autocapitalize="none" required>' +
      '<label class="etiket" for="sifre">Şifre</label><input id="sifre" type="password" class="kutu" autocomplete="current-password" required>' +
      '<div class="hata" id="hata">' + esc(mesaj || "") + '</div>' +
      '<button class="buton" type="submit" id="girisBtn">Giriş yap</button></form></div>';
  document.getElementById("girisForm").addEventListener("submit", function(e){
    e.preventDefault();
    var btn = document.getElementById("girisBtn");
    btn.disabled = true; btn.textContent = "Giriş yapılıyor…";
    sb.auth.signInWithPassword({email:epostaYap(deger("kadi")), password:document.getElementById("sifre").value}).then(function(r){
      if(r.error){
        btn.disabled = false; btn.textContent = "Giriş yap";
        document.getElementById("hata").textContent = /invalid/i.test(r.error.message) ? "Kullanıcı adı veya şifre yanlış." : hataMesaji(r.error);
        return;
      }
      oturum = r.data.session; acilis();
    });
  });
  document.getElementById("kadi").focus();
}
function cikisYap(){
  onayla("Çıkış yapılsın mı?", "", "Çıkış yap", async function(){
    await sb.auth.signOut(); oturum = null; hazir = false; veri = {hareketler:[], musteriler:[]};
    history.replaceState(null, "", "#ana"); girisEkrani();
  });
}

/* ================= AÇILIŞ & CANLI GÜNCELLEME ================= */
function yukleniyor(){ document.getElementById("uygulama").innerHTML = '<div class="yukleniyor"><span class="donen"></span>Yükleniyor…</div>'; }

async function acilis(){
  yukleniyor();
  try{ await Depo.yukle(); }
  catch(e){
    if(/JWT|auth/i.test(e.message || "")){ girisEkrani("Oturum süresi doldu, tekrar giriş yapın."); return; }
    document.getElementById("uygulama").innerHTML = '<div class="giris-ekrani"><div class="kart" style="text-align:center"><p>' + esc(hataMesaji(e)) + '</p>' +
      '<button class="buton" onclick="acilis()">Tekrar dene</button></div></div>';
    return;
  }
  hazir = true; ciz();
  if(cevrimici) canliBaglan();
}

// Başka cihazda bir şey kaydedilince bu ekran da kendiliğinden güncellenir.
var kanal = null, yenileZamanlayici = null;
function canliBaglan(){
  if(kanal) return;
  kanal = sb.channel("degisiklikler")
    .on("postgres_changes", {event:"*", schema:"public", table:"hareketler"}, function(p){ canliDegisiklik("hareketler", p); })
    .on("postgres_changes", {event:"*", schema:"public", table:"musteriler"}, function(p){ canliDegisiklik("musteriler", p); })
    .subscribe();
}
function canliDegisiklik(tablo, p){
  if(p.eventType === "DELETE"){ veri[tablo] = veri[tablo].filter(function(x){ return x.id !== p.old.id; }); }
  else bellegeYaz(tablo, buluttanCevir(tablo, p.new));
  sessizCiz();
}
// Kullanıcı form dolduruyorsa ekranı yenileme, yazdığı kaybolmasın.
function sessizCiz(){
  clearTimeout(yenileZamanlayici);
  yenileZamanlayici = setTimeout(function(){
    if(!hazir || FORM_EKRANLARI[ekranAdi()] || document.querySelector(".perde")) return;
    var y = window.scrollY; ciz(); window.scrollTo(0, y);
  }, 250);
}
// Telefon uykudan uyanınca en güncel bilgiyi çek.
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState !== "visible" || !cevrimici || !hazir) return;
  Depo.yukle().then(sessizCiz).catch(function(){});
});

(async function(){
  if(!cevrimici){ acilis(); return; }
  if(!sb){ // Bulut ayarlı ama kütüphane inmedi: yerel moda düşme, bağlantı iste.
    document.getElementById("uygulama").innerHTML = '<div class="giris-ekrani"><div class="kart" style="text-align:center"><p>İnternet bağlantısı yok gibi görünüyor.</p>' +
      '<button class="buton" onclick="location.reload()">Tekrar dene</button></div></div>';
    document.body.classList.add("girissiz"); return;
  }
  var r = await sb.auth.getSession();
  oturum = r.data.session;
  sb.auth.onAuthStateChange(function(olay, s){ oturum = s; if(olay === "SIGNED_OUT" && hazir){ hazir = false; girisEkrani(); } });
  if(oturum) acilis(); else girisEkrani();
})();
</script>
</body>
</html>
