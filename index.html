/* --- Dosya yükleme / gösterme --- */
let yuklemeEl = null;
function yuklemeGoster(y){
  if(!yuklemeEl){ yuklemeEl = document.createElement("div"); yuklemeEl.className = "yukleme"; document.body.appendChild(yuklemeEl); }
  yuklemeEl.textContent = y;
}
function yuklemeKapat(){ if(yuklemeEl){ yuklemeEl.remove(); yuklemeEl = null; } }
// Fotoğrafları küçültür (telefon fotoğrafı 5 MB yerine ~300 KB olur); video ve belgeler olduğu gibi yüklenir.
async function gorselKucult(file, enFazla){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try{
    const bmp = await createImageBitmap(file, {imageOrientation:"from-image"});
    const oran = Math.min(1, (enFazla || 1600) / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * oran); c.height = Math.round(bmp.height * oran);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    if(bmp.close) bmp.close();
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
    if(blob && (blob.size < file.size || oran < 1)) return new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", {type:"image/jpeg"});
  }catch(e){}
  return file;
}
async function dosyaSecildi(input, ieId){
  const liste = Array.from(input.files || []); input.value = "";
  if(!liste.length) return;
  let tamam = 0; const sorunlu = [];
  for(let i = 0; i < liste.length; i++){
    yuklemeGoster("Yükleniyor " + (i + 1) + "/" + liste.length + "…");
    let yuklenen = null;
    try{
      const f = await gorselKucult(liste[i]);
      const id = yeniId(), guvenli = f.name.normalize("NFKD").replace(/[^\w.\-]+/g, "_").slice(-80), anahtar = ieId + "/" + id + "_" + guvenli;
      const r = await sb.storage.from(BUCKET).upload(anahtar, f, {contentType: f.type || "application/octet-stream", upsert:false});
      if(r.error) throw r.error;
      yuklenen = anahtar;
      await Depo.kaydet("dosyalar", {id, isEmriId:ieId, ad:f.name, tur:f.type || "", boyut:f.size, yol:anahtar, yukleyen:kullaniciAdi(), olusma:Date.now() + i});
      tamam++;
    }catch(e){
      if(yuklenen) sb.storage.from(BUCKET).remove([yuklenen]).catch(() => {});
      sorunlu.push(liste[i].name + " — " + hataMesaji(e));
    }
  }
  yuklemeKapat();
  if(tamam){ try{ await notEkle(ieId, tamam + " dosya eklendi"); }catch(e){} bildir(tamam + " dosya yüklendi"); }
  if(sorunlu.length) uyar("Bazı dosyalar yüklenemedi", sorunlu.join("; "));
  if(yol()[0] === "is") ciz();
}
const urlOnbellek = {};
async function urlleriGetir(dosyalar){
  const simdi = Date.now(), eksik = dosyalar.filter(d => !urlOnbellek[d.yol] || urlOnbellek[d.yol].bitis < simdi);
  if(!eksik.length || !sb) return;
  const r = await sb.storage.from(BUCKET).createSignedUrls(eksik.map(d => d.yol), 3600);
  if(!r.error) r.data.forEach(x => { if(x.signedUrl) urlOnbellek[x.path] = {url:x.signedUrl, bitis:simdi + 3300000}; });
}
function galeriDoldur(){
  const el = Array.from(document.querySelectorAll("[data-yol]"));
  if(!el.length) return;
  urlleriGetir(el.map(e => ({yol:e.getAttribute("data-yol")}))).then(() => el.forEach(e => {
    const u = urlOnbellek[e.getAttribute("data-yol")]; if(!u || !document.body.contains(e)) return;
    if(e.tagName === "A") e.href = u.url; else e.src = e.tagName === "VIDEO" ? u.url + "#t=0.1" : u.url;
  })).catch(() => {});
}
EYLEM.dosyaAc = (el, arg) => { const [ieId, id] = arg.split("|"); lightbox(ieId, id); };
function lightbox(ieId, id){
  const liste = isDosyalari(ieId).filter(d => dosyaTuru(d) !== "d");
  let i = Math.max(0, liste.findIndex(d => d.id === id));
  const p = document.createElement("div"); p.className = "lb";
  const goster = () => {
    const d = liste[i], u = (urlOnbellek[d.yol] || {}).url || "";
    p.innerHTML = '<div class="lb-bar"><span>' + (i + 1) + ' / ' + liste.length + ' · ' + esc(d.ad) + '</span><button data-k="kapat" aria-label="Kapat">' + ik("x") + '</button></div>' +
      '<div class="lb-orta"><button data-k="geri" aria-label="Önceki">' + ik("sol") + '</button>' +
      (dosyaTuru(d) === "v" ? '<video src="' + esc(u) + '" controls playsinline autoplay></video>' : '<img src="' + esc(u) + '" alt="">') +
      '<button data-k="ileri" aria-label="Sonraki">' + ik("sag") + '</button></div>' +
      '<div class="lb-bar"><button data-k="paylas">' + ik("mesaj") + 'WhatsApp / Paylaş</button><a href="' + esc(u) + '" download="' + esc(d.ad) + '" target="_blank" rel="noopener">' + ik("indir") + 'İndir</a><button data-k="sil">' + ik("sil") + 'Sil</button></div>';
  };
  p.addEventListener("click", e => {
    const b = e.target.closest("[data-k]"); if(!b){ return; }
    const k = b.getAttribute("data-k");
    if(k === "kapat") p.remove();
    else if(k === "geri"){ i = (i + liste.length - 1) % liste.length; goster(); }
    else if(k === "ileri"){ i = (i + 1) % liste.length; goster(); }
    else if(k === "paylas") dosyaPaylas(ieId, liste[i]);
    else if(k === "sil"){
      const d = liste[i];
      onayla("Dosya silinsin mi?", d.ad + " — çöp kutusuna taşınır.", "Sil", () => islem(null, async () => {
        await Depo.sil("dosyalar", d.id); p.remove(); bildir("Dosya çöp kutusuna taşındı"); if(yol()[0] === "is") ciz();
      }));
    }
  });
  document.body.appendChild(p);
  urlleriGetir(liste).then(goster).catch(goster);
}
// Telefonda doğrudan WhatsApp'a (paylaşma menüsü) gönderir; olmazsa 7 gün geçerli bağlantı ekler.
async function dosyaPaylas(ieId, d){
  const ie = bul("is_emirleri", ieId), m = bul("musteriler", ie.musteriId) || {};
  try{
    await urlleriGetir([d]);
    const blob = await (await fetch(urlOnbellek[d.yol].url)).blob();
    const f = new File([blob], d.ad, {type: d.tur || blob.type});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], text: FIRMA + " · " + ie.no + " " + ie.baslik}); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  try{
    const r = await sb.storage.from(BUCKET).createSignedUrl(d.yol, 604800);
    if(r.error) throw r.error;
    waPencere({tel:m.telefon, ad:m.ad, isEmriId:ieId, sablonlar:[{ad:"Dosya bağlantısı", metin:"Merhaba " + (m.ad || "") + ", " + ie.no + " siparişinize ait dosya:\n" + r.data.signedUrl + "\n(Bağlantı 7 gün geçerlidir)\n\n" + FIRMA}]});
  }catch(e){ uyar("Paylaşılamadı", hataMesaji(e)); }
}

// Projeler "katalog" tablosunda, fotoğrafları "katalog_gorseller" tablosunda; dosyalar Storage'da "katalog/<proje>/" altında durur.
const KATALOG_KLASOR = "katalog";

const DOSYA_TABLO = {dosyalar:1, katalog_gorseller:1, paylasimlar:1};

function katalogKategorileri(){

}
const gorselSira = (a, b) => a.sira - b.sira || a.olusma - b.olusma;
// Katalogda fotoğrafın yanında video da durabilir; kapak olarak ilk fotoğraf kullanılır.
const videoMu = g => /^video\//.test(g.tur || "") || /\.(mp4|mov|webm|m4v)(\?|$)/i.test(g.yol || "");
const medyaEtiket = (g, ek) => videoMu(g) ? '<video data-yol="' + esc(g.yol) + '" preload="metadata" muted playsinline></video><span class="oynat">' + ik("oynat") + '</span>'

// 3B çizimler (DWG / STL) aynı tabloda durur ama kapak, galeri, sunum ve paylaşımda kullanılmaz.

/* --- ZIP'ten toplu içe aktarma --- */
// Her klasör bir proje olur (Facebook "bilgilerini indir" dosyasında albüm klasörleri gibi).
// İsteğe bağlı katalog.json: {kategori, projeler:[{klasor, baslik, kategori, aciklama, malzeme, olcu}]}
const RESIM_UZANTI = {jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", webp:"image/webp", mp4:"video/mp4", m4v:"video/mp4", mov:"video/quicktime", webm:"video/webm", dwg:"application/acad", stl:"model/stl"};
const dogalSira = (a, b) => a.localeCompare(b, "tr", {numeric:true});
function ekranKatalogIce(){
  if(!cevrimici) return {baslik:"ZIP'ten içe aktar", geri:true, html:'<div class="uyari">İçe aktarmak için bulut bağlantısı gerekir.</div>'};
  if(eksikTablo.katalog) return ekranKatalog();
  form = {ice:null};
  const html = '<div class="kart form-kart"><div>Fotoğrafları içeren bir ZIP dosyası seçin. <b>Her klasör bir proje</b> olur; klasör adı proje adı olarak gelir. ' +
    'Fotoğraf ve videolar (mp4, mov, webm) alınır. Önizlemede istemediğiniz grupları çıkarabilir, adını ve kategorisini değiştirebilirsiniz.</div>' +
    '<div class="alt-bilgi">Facebook\'tan indirdiğiniz yedekte albümler ayrı klasörlerdedir. Büyük dosyalar için bilgisayar ve Wi-Fi önerilir.</div>' +
    '<button class="buton ikincil" onclick="document.getElementById(\'iceZip\').click()">' + ik("yukle") + 'ZIP dosyası seç</button>' +
    '<input type="file" id="iceZip" accept=".zip,application/zip" style="display:none" onchange="iceZipSecildi(this)">' +
    '<div id="iceOnizleme"></div></div>';
  return {baslik:"ZIP'ten içe aktar", geri:true, html};
}
async function iceZipSecildi(input){
  const f = input.files[0]; input.value = ""; if(!f) return;
  try{
    yuklemeGoster("ZIP açılıyor…");
    await jszipYukle();
    const zip = await JSZip.loadAsync(f);
    let tanim = null;
    const j = zip.file(/(^|\/)katalog\.json$/)[0];
    if(j){ try{ tanim = JSON.parse(await j.async("string")); }catch(e){} }
    const gruplar = {};
    zip.forEach((yol_, e) => {
      const uz = (yol_.match(/\.(\w+)$/) || [])[1];
      if(e.dir || !uz || !RESIM_UZANTI[uz.toLowerCase()] || /(^|\/)(__MACOSX|\.)/.test(yol_)) return;
      const p = yol_.split("/"), klasor = p.length > 1 ? p[p.length - 2] : "Fotoğraflar";
      (gruplar[klasor] = gruplar[klasor] || []).push(e);
    });
    const tp = (tanim && Array.isArray(tanim.projeler)) ? tanim.projeler : [];
    const sirali = Object.keys(gruplar).sort((a, b) => {
      const x = tp.findIndex(t => t.klasor === a), y = tp.findIndex(t => t.klasor === b);
      return (x < 0 ? 1e9 : x) - (y < 0 ? 1e9 : y) || dogalSira(a, b);
    });
    if(!sirali.length){ yuklemeKapat(); return uyar("ZIP içinde fotoğraf bulunamadı", "JPG, PNG veya WEBP fotoğraflar klasörler halinde olmalı."); }
    const varsayilanKat = (tanim && tanim.kategori) || (filtre.katalog !== "hepsi" ? filtre.katalog : katalogKategorileri()[0]);
    form.ice = sirali.map(k => {
      const t = tp.find(x => x.klasor === k) || {}, baslik = String(t.baslik || k).slice(0, 120);
      return {klasor:k, dosyalar:gruplar[k].sort((a, b) => dogalSira(a.name, b.name)), baslik, kategori:String(t.kategori || varsayilanKat).slice(0, 40),
        aciklama:String(t.aciklama || "").slice(0, 2000), malzeme:String(t.malzeme || "").slice(0, 200), olcu:String(t.olcu || "").slice(0, 200),
        var: veri.katalog.some(p => p.baslik === baslik), sec: !veri.katalog.some(p => p.baslik === baslik)};
    });
    // Önizleme küçük resimleri (ilk fotoğraf)
    for(const g of form.ice){ const ilk = g.dosyalar.find(e => !/\.(mp4|m4v|mov|webm)$/i.test(e.name)) || g.dosyalar[0]; g.onizlemeVideo = ilk !== g.dosyalar.find(e => !/\.(mp4|m4v|mov|webm)$/i.test(e.name)); g.onizleme = URL.createObjectURL(await ilk.async("blob")); }
    yuklemeKapat();

  }catch(e){ yuklemeKapat(); uyar("ZIP açılamadı", hataMesaji(e)); }
}

async function gorselSecildi(input, projeId){

// Sunumda net görünsün diye 2400 piksele kadar küçültülür.
// toplu: {etiket, sorunlu:[]} verilirse ilerleme yazısına etiket eklenir, hatalar listeye yazılır (toplu içe aktarma).
async function gorselleriYukle(projeId, liste, toplu){
  const uygun = f => /^(image|video)\//.test(f.type) || CAD_UZANTI.test(f.name);
  const turu = f => /\.dwg$/i.test(f.name) ? "application/acad" : /\.stl$/i.test(f.name) ? "model/stl" : f.type;
  const resimler = liste.filter(uygun), sorunlu = liste.filter(f => !uygun(f)).map(f => f.name + " (fotoğraf, video veya DWG / STL çizimi değil)");
  let sira = projeGorselleri(projeId).reduce((m, g) => Math.max(m, g.sira), 0), tamam = 0;
  for(let i = 0; i < resimler.length; i++){
    yuklemeGoster((toplu ? toplu.etiket + " · " : "") + (/^video\//.test(resimler[i].type) ? "Video" : CAD_UZANTI.test(resimler[i].name) ? "Çizim" : "Fotoğraf") + " yükleniyor " + (i + 1) + "/" + resimler.length + "…");
    let yuklenen = null;
    try{
      const f = await gorselKucult(resimler[i], 2400);
      const id = yeniId(), anahtar = KATALOG_KLASOR + "/" + projeId + "/" + id + "_" + guvenliDosyaAdi(f.name);
      const r = await sb.storage.from(BUCKET).upload(anahtar, f, {contentType: turu(f) || "image/jpeg", upsert:false});
      if(r.error) throw r.error;
      yuklenen = anahtar; sira += 10;
      await Depo.kaydet("katalog_gorseller", {id, projeId, ad:f.name, tur:turu(f) || "", boyut:f.size, yol:anahtar, sira, olusma:Date.now() + i});
      tamam++;
    }catch(e){
      if(yuklenen) sb.storage.from(BUCKET).remove([yuklenen]).catch(() => {});
      sorunlu.push(resimler[i].name + " — " + hataMesaji(e));
    }
  }
  if(toplu){ toplu.sorunlu.push(...sorunlu); return tamam; }
  yuklemeKapat();
  if(tamam) bildir(tamam + " dosya yüklendi");
  if(sorunlu.length) uyar("Bazı dosyalar yüklenemedi", sorunlu.join("; "));
  return tamam;
}

async function gorselDondur(g){
  let yeni = null;
  yuklemeGoster("Döndürülüyor…");
  try{
    await urlleriGetir([g]);
    const u = urlOnbellek[g.yol]; if(!u) throw new Error("fotoğraf alınamadı");
    const bmp = await createImageBitmap(await (await fetch(u.url)).blob());
    const c = document.createElement("canvas"); c.width = bmp.height; c.height = bmp.width;
    const x = c.getContext("2d"); x.translate(c.width, 0); x.rotate(Math.PI / 2); x.drawImage(bmp, 0, 0);
    if(bmp.close) bmp.close();
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
    if(!blob) throw new Error("fotoğraf işlenemedi");
    const ad = g.ad.replace(/\.\w+$/, "") + ".jpg";
    yeni = KATALOG_KLASOR + "/" + g.projeId + "/" + yeniId() + "_" + guvenliDosyaAdi(ad);
    const r = await sb.storage.from(BUCKET).upload(yeni, blob, {contentType:"image/jpeg", upsert:false});
    if(r.error) throw r.error;
    await Depo.kaydet("katalog_gorseller", Object.assign({}, g, {yol:yeni, ad, tur:"image/jpeg", boyut:blob.size}));
    yeni = null;
    sb.storage.from(BUCKET).remove([g.yol]).catch(() => {});
    bildir("Fotoğraf döndürüldü");
  }catch(e){
    if(yeni) sb.storage.from(BUCKET).remove([yeni]).catch(() => {});
    uyar("Döndürülemedi", hataMesaji(e));
  }finally{ yuklemeKapat(); }
  if(yol()[0] === "proje") ciz();
}

function sunumAc(liste, bas, musteri){
  if(!liste.length) return uyar("Sunulacak fotoğraf yok", musteri ? "" : "Önce projelere fotoğraf yükleyin.");

    (document.fullscreenEnabled ? '<button data-k="tam" aria-label="Tam ekran">' + ik("ekran") + '</button>' : '') +
    (musteri ? (waNumara(musteri.telefon) ? '<button data-k="sor" aria-label="WhatsApp ile sor">' + ik("mesaj") + '<span class="yazi-gizle">Bilgi al</span></button>' : '') :
      '<button data-k="teklif" class="yonetici-ozel" aria-label="Teklif hazırla">' + ik("is") + '<span class="yazi-gizle">Teklif hazırla</span></button>') +
    '<button data-k="kapat" aria-label="Kapat">' + ik("x") + '</button></div>' +
    '<div class="sn-orta"><img alt=""><video class="sn-gizli" controls playsinline preload="metadata"></video>' + (liste.length > 1 ? '<button class="ok sol" data-k="geri" aria-label="Önceki">' + ik("sol") + '</button>' +
    '<button class="ok sag" data-k="ileri" aria-label="Sonraki">' + ik("sag") + '</button>' : '') + '</div><div class="sn-alt"></div>';
  const img = s.querySelector(".sn-orta img"), vid = s.querySelector(".sn-orta video");
  const goster = () => {
    const {g, p} = liste[i], u = urlOnbellek[g.yol], v = videoMu(g);
    img.classList.toggle("sn-gizli", v); vid.classList.toggle("sn-gizli", !v);
    if(v){ img.removeAttribute("src"); if(u && vid.getAttribute("src") !== u.url){ vid.src = u.url; vid.play().catch(() => {}); } }
    else { vid.pause(); vid.removeAttribute("src"); if(u) img.src = u.url; else img.removeAttribute("src"); }
    img.alt = p.baslik;
    s.querySelector(".sayac").textContent = (i + 1) + " / " + liste.length;
    s.querySelector(".sn-alt").innerHTML = '<div class="k">' + esc(p.kategori) + '</div><h3>' + esc(p.baslik) + '</h3>' +
      (p.malzeme || p.olcu || (musteri && p.fiyat) ? '<div class="o">' + (p.malzeme ? '<div><span>Malzeme:</span> ' + esc(p.malzeme) + '</div>' : '') + (p.olcu ? '<div><span>Ölçü:</span> ' + esc(p.olcu) + '</div>' : '') +
        (musteri && p.fiyat ? '<div><span>Başlangıç fiyatı:</span> ' + para(p.fiyat) + ' + KDV</div>' : '') + '</div>' : '') +
      (p.aciklama ? '<div class="d">' + esc(p.aciklama) + '</div>' : '');
    [1, -1].forEach(n => { const x = liste[(i + n + liste.length) % liste.length].g, v = urlOnbellek[x.yol]; if(v && !videoMu(x)) new Image().src = v.url; });   // komşuları önceden yükle
  };
  const adim = n => { i = (i + n + liste.length) % liste.length; goster(); };
  const otoAyarla = ac => {
    clearInterval(oto); oto = ac ? setInterval(() => { if(!videoMu(liste[i].g) || vid.ended || vid.paused) adim(1); }, 5000) : null;   // video oynarken bekler
    const b = s.querySelector('[data-k="oto"]');
    if(b){ b.classList.toggle("acik", !!ac); b.innerHTML = ik(ac ? "duraklat" : "oynat") + '<span class="yazi-gizle">' + (ac ? "Durdur" : "Otomatik") + '</span>'; }
  };
  const bilgi = () => { s.classList.toggle("bilgisiz"); s.querySelector('[data-k="bilgi"]').classList.toggle("acik", !s.classList.contains("bilgisiz")); };
  const tamEkran = () => { if(document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if(s.requestFullscreen) s.requestFullscreen().catch(() => {}); };
  const kapat = () => {
    otoAyarla(false); vid.pause(); document.removeEventListener("keydown", tus); window.removeEventListener("hashchange", kapat);
    if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
    s.remove();
  };
  const tus = e => {
    if(e.key === "ArrowRight" || e.key === "PageDown"){ adim(1); e.preventDefault(); }
    else if(e.key === "ArrowLeft" || e.key === "PageUp"){ adim(-1); e.preventDefault(); }
    else if(e.key === "Escape") kapat();
    else if(e.key === " " && liste.length > 1){ otoAyarla(!oto); e.preventDefault(); }
    else if(e.key === "i") bilgi();
    else if(e.key === "f") tamEkran();
  };
  s.addEventListener("click", e => {
    const b = e.target.closest("[data-k]");
    if(!b){ if(e.target === img) bilgi(); return; }
    const k = b.getAttribute("data-k");
    if(k === "ileri") adim(1); else if(k === "geri") adim(-1);
    else if(k === "oto") otoAyarla(!oto); else if(k === "bilgi") bilgi(); else if(k === "tam") tamEkran();
    else if(k === "kapat") kapat();
    else if(k === "teklif"){ const id = liste[i].p.id; kapat(); git("is-form/-/-/" + id); }
    else if(k === "sor") window.open(vitrinWaLink(musteri.telefon, "“" + liste[i].p.baslik + "” projesi hakkında bilgi almak istiyorum."), "_blank", "noopener");
  });
  s.addEventListener("touchstart", e => { dokunX = e.touches.length === 1 ? e.touches[0].clientX : null; }, {passive:true});
  s.addEventListener("touchend", e => {
    if(dokunX === null) return;
    const dx = e.changedTouches[0].clientX - dokunX; dokunX = null;
    if(Math.abs(dx) > 50) adim(dx < 0 ? 1 : -1);
  });
  document.addEventListener("keydown", tus);
  window.addEventListener("hashchange", kapat);   // telefonun geri tuşu sunumu kapatsın
  document.body.appendChild(s);
  goster();
  (async () => { for(let k = 0; k < liste.length; k += 100) await urlleriGetir(liste.slice(k, k + 100).map(x => x.g)); })()
    .then(() => { if(document.body.contains(s)) goster(); }).catch(() => {});
}

// Ana sayfadaki "Yapılacaklar". seviye: 0 acil (kırmızı), 1 yaklaşan (sarı), 2 bilgi.
function hatirlatmalar(){
  const bg = bugun(), yarin = gunEkle(bg, 1), l = [], ss = sistem();
  const gunFark = t => Math.round((tarihOku(t) - tarihOku(bg)) / 86400000);
  const ne = t => { const g = gunFark(t); return g < 0 ? -g + " gün gecikti" : g === 0 ? "bugün" : g === 1 ? "yarın" : g + " gün sonra"; };
  veri.is_emirleri.forEach(ie => {
    const m = cariAdi(ie.musteriId);
    if(ac(ie) && ie.durum !== "Teklif" && ie.teslimTarihi && ie.teslimTarihi <= gunEkle(bg, ss.teslimGun))
      l.push({seviye: ie.teslimTarihi <= bg ? 0 : 1, tarih:ie.teslimTarihi, ikon:"is", yer:"is/" + ie.id,
        yazi:"Teslim " + ne(ie.teslimTarihi) + ": " + ie.no + " " + ie.baslik, alt:[m, ie.durum].filter(Boolean).join(" · ")});
    const g = ie.durum === "Teklif" && ie.teklif && ie.teklif.gecerlilik;
    if(g && g <= gunEkle(bg, ss.teklifGun) && g >= gunEkle(bg, -14))
      l.push({seviye: g < bg ? 1 : 2, tarih:g, ikon:"fatura", yer:"is/" + ie.id, yazi:(g < bg ? "Teklif süresi geçti: " : "Teklif süresi doluyor (" + ne(g) + "): ") + ie.baslik,
        alt:m + " · müşteriyi arayın"});
  });
  veri.faturalar.forEach(f => {
    const tk = taksitDurumu(f);
    if(tk.length){
      tk.filter(t => t.kalan > 0 && t.vade <= gunEkle(bg, ss.vadeGun)).forEach(t => l.push({seviye: t.vade <= bg ? 0 : 1, tarih:t.vade, ikon:"asagi", yer:"fatura/" + f.id,
        yazi:taksitAdi(t) + " " + ne(t.vade) + ": " + para(t.kalan), alt:cariAdi(f.musteriId) + " · " + f.no}));
      return;
    }
    if(!f.vade || f.vade > gunEkle(bg, ss.vadeGun)) return;
    const od = odemeDurumu(f); if(!(od.kalan > 0)) return;
    l.push({seviye: f.vade <= bg ? 0 : 1, tarih:f.vade, ikon: f.tur === "satis" ? "asagi" : "yukari", yer:"fatura/" + f.id,
      yazi:(f.tur === "satis" ? "Tahsilat " : "Ödeme ") + ne(f.vade) + ": " + para(od.kalan), alt:cariAdi(f.musteriId) + " · " + f.no});
  });
  randevular().filter(x => !x.r.tamam && x.ie.durum !== "İptal" && x.r.tarih >= bg && x.r.tarih <= gunEkle(bg, 14)).forEach(x => {
    const c = cakisanlar(x.r);
    if(c.length && x.r.id < c[0].r.id) l.push({seviye:0, tarih:x.r.tarih, ikon:"takvim", yer:"takvim/" + haftaBasi(x.r.tarih), yazi:"Randevu çakışması " + ne(x.r.tarih) + ": " + x.ie.no + " ile " + c[0].ie.no,
      alt:"Aynı ekip aynı saatte iki yerde"});
    if(yetki.yonetici && !x.r.hatirlatildi && x.r.tarih <= yarin && x.r.tur !== "Ölçü / keşif") l.push({seviye:1, tarih:x.r.tarih, ikon:"mesaj", yer:"takvim/" + haftaBasi(x.r.tarih),
      yazi:x.r.tur + " " + ne(x.r.tarih) + " " + (x.r.saat || "") + ": müşteriye hatırlatma gönderin", alt:x.ie.no + " " + x.ie.baslik + " · " + cariAdi(x.ie.musteriId)});
  });
  if(yetki.yonetici) veri.cekler.filter(c => cekAcik(c) && c.vade && c.vade <= gunEkle(bg, ss.vadeGun)).forEach(c => l.push({seviye: c.vade <= bg ? 0 : 1, tarih:c.vade, ikon:c.tur === "alinan" ? "asagi" : "yukari", yer:"cekler/" + c.id,
    yazi:(c.tur === "alinan" ? (c.durum === "tahsilde" ? "Tahsildeki " : "Tahsile verin: ") : "Ödenecek ") + belgeAdi(c).toLocaleLowerCase("tr") + " " + ne(c.vade) + ": " + para(c.tutar), alt:(cariAdi(c.musteriId) || c.kesideci) + (c.banka ? " · " + c.banka : "")}));
  stokAzalanlar().forEach(m => l.push({seviye:1, tarih:bg, ikon:"koli", yer:"siparisler", yazi:"Stok azaldı: " + m.ad, alt:"Kalan " + miktarYaz(stokMiktar(m.id)) + " " + m.birim + " · asgari " + miktarYaz(m.min)}));
  if(!personelEksik()){
    const aktif = veri.personel.filter(p => calisiyor(p, bg));
    const eksik = aktif.filter(p => !veri.puantaj.some(x => x.personelId === p.id && x.tarih === bg)).length;
    if(eksik && new Date().getHours() >= 10) l.push({seviye:1, tarih:bg, ikon:"tamam", yer:"puantaj", yazi:"Bugünün puantajı girilmedi (" + eksik + " kişi)", alt:"Personel → Puantaj"});
    const ay = bg.slice(0, 7), sonGun = ay + "-" + ayGunSayisi(ay);
    if(gunFark(sonGun) <= 2){
      const odenmedi = aktif.filter(p => p.ucretTipi === "aylik" && !veri.personel_hareket.some(h => h.personelId === p.id && h.tur === "hakedis" && h.donem === ay));
      if(odenmedi.length) l.push({seviye:2, tarih:sonGun, ikon:"kasa", yer:"maas/ay", yazi:"Maaş zamanı: " + odenmedi.length + " kişinin bu ay hakedişi kaydedilmedi", alt:odenmedi.map(p => p.ad).join(", ")});
    }
  }
  return l.sort((a, b) => a.seviye - b.seviye || (a.tarih < b.tarih ? -1 : a.tarih > b.tarih ? 1 : 0));
}
const HATIRLATMA_RENK = ["r-cikis", "r-ana", "r-borc"];

// Telefon takvimine eklenecek .ics dosyası: tüm gün etkinlik, bir gün önce saat 09:00'da hatırlatma.
function takvimIndir(baslik, tarih, aciklama, dosya){ takvimIndirCok([{baslik, tarih, aciklama}], dosya); }
function takvimIndirCok(olaylar, dosya){
  const kac = s => String(s || "").replace(/[\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const damga = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Gunes Mobilya//TR", "CALSCALE:GREGORIAN"].concat(...olaylar.map(o => ["BEGIN:VEVENT",
    "UID:" + yeniId() + "@gunesmobilya", "DTSTAMP:" + damga, "DTSTART;VALUE=DATE:" + o.tarih.replace(/-/g, ""), "DTEND;VALUE=DATE:" + gunEkle(o.tarih, 1).replace(/-/g, ""),
    "SUMMARY:" + kac(o.baslik), "DESCRIPTION:" + kac(o.aciklama), "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + kac(o.baslik), "TRIGGER:-PT15H", "END:VALARM",
    "END:VEVENT"]), ["END:VCALENDAR"]).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar;charset=utf-8"}));
  a.download = guvenliAd(dosya) + ".ics"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  bildir("Takvim dosyası indirildi; açıp takvime ekleyin");
}

    '<div class="buton-sira"><button class="buton ikincil" data-k="kapat">Vazgeç</button><button class="buton" data-k="aktar">' + ik("tamam") + 'Fiyatı kaleme aktar</button></div></div>';

    if(e.target.id === "hIscilik") h.iscilik = Math.max(0, sayiOku(e.target.value) || 0);
    else if(e.target.id === "hKar") h.kar = Math.max(0, sayiOku(e.target.value) || 0);
    const d = e.target.closest("[data-j]");
    if(d){
      const s = h.satirlar[Number(d.getAttribute("data-j"))];
      if(e.target.classList.contains("h-m")){
        const m = ml.find(x => x.id === e.target.value);
        Object.assign(s, m ? {malzemeId:m.id, ad:m.ad, birim:m.birim, fiyat:m.fiyat} : {malzemeId:"", birim:""});
        return ciz_();
      }
      s.miktar = Math.max(0, sayiOku(d.querySelector(".h-miktar").value) || 0);
      s.fiyat = Math.max(0, sayiOku(d.querySelector(".h-fiyat").value) || 0);
      if(d.querySelector(".h-ad")) s.ad = d.querySelector(".h-ad").value.trim();
    }
    ozet();
  };
  p.addEventListener("input", oku); p.addEventListener("change", e => { if(e.target.classList.contains("h-m")) oku(e); });
  p.addEventListener("click", e => {
    const b = e.target.closest("[data-k]");
    if(!b){ if(e.target === p) p.remove(); return; }
    const c = b.getAttribute("data-k");
    if(c === "kapat") return p.remove();
    if(c === "ekle"){ h.satirlar.push({malzemeId:"", ad:"", birim:"", fiyat:0, miktar:0}); return ciz_(); }
    if(c === "sil"){ h.satirlar.splice(Number(b.closest("[data-j]").getAttribute("data-j")), 1); if(!h.satirlar.length) h.satirlar.push({malzemeId:"", ad:"", birim:"", fiyat:0, miktar:0}); return ciz_(); }
    if(c === "aktar"){
      h.satirlar = h.satirlar.filter(s => s.miktar > 0 && s.fiyat > 0);
      const r = malzemeHesap(h);
      if(!(r.satis > 0)){ if(!h.satirlar.length) h.satirlar.push({malzemeId:"", ad:"", birim:"", fiyat:0, miktar:0}); ciz_(); p.querySelector("#hHata").textContent = "En az bir malzemenin miktarını ve fiyatını yazın."; return; }
      k.fiyat = r.satis; k.maliyet = r.maliyet; k.hesap = h;
      p.remove(); ikalemleriCiz(); bildir("Birim fiyat: " + para(r.satis));
    }
  });
  document.body.appendChild(p);
  ciz_();
};

EYLEM.stokIslem = (el, arg) => {
  const [mid, tur] = arg.split("|"), m = malzemeListesi().find(x => x.id === mid); if(!m) return;
  const mevcut = stokMiktar(mid), isler = veri.is_emirleri.filter(ac).sort((a, b) => b.olusma - a.olusma);
  const p = document.createElement("div"); p.className = "perde";
  p.innerHTML = '<div class="pencere" style="max-width:420px"><p>' + esc(m.ad) + ' · ' + STOK_TUR[tur] + '</p><div class="alt-bilgi">Şu an stokta: <b>' + miktarYaz(mevcut) + ' ' + esc(m.birim) + '</b></div>' +
    '<label class="etiket" for="skMiktar">' + (tur === "duzeltme" ? "Sayılan miktar" : "Miktar") + ' (' + esc(m.birim) + ')</label><input id="skMiktar" class="kutu tutar-kutu" inputmode="decimal">' +
    tarihAlani("skTarih", "Tarih", bugun()) +
    (tur === "cikis" ? '<label class="etiket" for="skIs">Hangi iş için? <span class="ist">(isteğe bağlı)</span></label><select id="skIs" class="kutu"><option value="">— Yok —</option>' +

    '<label class="etiket" for="skNot">Açıklama <span class="ist">(isteğe bağlı)</span></label><input id="skNot" class="kutu" maxlength="200" placeholder="' + (tur === "giris" ? "Tedarikçi, fatura no…" : "") + '">' +
    '<div class="hata" id="skHata"></div><div class="buton-sira"><button class="buton ikincil" data-c="hayir">Vazgeç</button><button class="buton" data-c="kaydet">' + ik("tamam") + 'Kaydet</button></div></div>';
  p.addEventListener("click", e => {
    const b = e.target.closest("[data-c]");
    if(!b){ if(e.target === p) p.remove(); return; }
    if(b.getAttribute("data-c") === "hayir") return p.remove();
    const q = sayiOku(p.querySelector("#skMiktar").value);
    if(!(tur === "duzeltme" ? q >= 0 : q > 0) || q > 1e7){ p.querySelector("#skHata").textContent = "Lütfen geçerli bir miktar yazın."; return; }
    const miktar = tur === "giris" ? q : tur === "cikis" ? -q : q - mevcut;
    if(tur === "duzeltme" && !miktar){ p.remove(); return bildir("Stok zaten doğru"); }
    b.disabled = true;
    Depo.kaydet("stok_hareket", {id:yeniId(), malzemeId:mid, tur, miktar:Math.round(miktar * 1000) / 1000, tarih:p.querySelector("#skTarih").value || bugun(),

      .then(() => { p.remove(); bildir(STOK_TUR[tur] + " kaydedildi"); ciz(); })
      .catch(err => { b.disabled = false; p.querySelector("#skHata").textContent = hataMesaji(err); });
  });

};

const rastgeleAnahtar = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => ("0" + b.toString(16)).slice(-2)).join("");

  if(eksikTablo.paylasimlar) return ekranPaylasimlar();
  const projeler = projeSirali(veri.katalog), kat = katalogKategorileri();
  const secili = p => projeId ? p.id === projeId : !kategori || p.kategori === kategori;
  const pr = bul("katalog", projeId);
  form = {sure:String(sistem().paylasimSure)};
  const html = '<div class="kart form-kart">' +
    '<label class="etiket" for="cari" style="margin-top:0">Müşteri <span class="ist">(isteğe bağlı; WhatsApp numarası buradan alınır)</span></label>' + cariSecici("", false, "musteri") +
    '<label class="etiket" for="shBaslik">Başlık</label><input id="shBaslik" class="kutu" maxlength="120" value="' + esc(pr ? pr.baslik : kategori ? kategori + " projelerimiz" : "Proje kataloğumuz") + '">' +
    '<label class="etiket" for="shMesaj">Mesaj <span class="ist">(sayfanın başında görünür)</span></label><textarea id="shMesaj" class="kutu" maxlength="600">Sizin için seçtiğimiz örnek projelerimizi inceleyebilirsiniz. Beğendiğiniz model için bize WhatsApp\'tan yazabilirsiniz.</textarea>' +
    '<div class="form-bolum">Gönderilecek projeler</div>' +
    '<div class="secenekler" style="margin:10px 0"><button type="button" class="secenek" data-is="paylasSec" data-arg="hepsi">Tümünü seç</button>' +
      kat.filter(k => projeler.some(p => p.kategori === k)).map(k => '<button type="button" class="secenek" data-is="paylasSec" data-arg="' + esc(k) + '">Sadece ' + esc(k) + '</button>').join("") + '</div>' +
    (projeler.length ? projeler.map(p => {
      const g = projeMedya(p.id);
      return '<label class="satir" style="cursor:pointer"><input type="checkbox" class="pSec" value="' + p.id + '" data-kat="' + esc(p.kategori) + '"' + (secili(p) ? ' checked' : '') + ' style="width:20px;height:20px">' +
        '<span class="kapak" style="width:56px;flex:0 0 56px;border-radius:8px">' + (g.length ? medyaEtiket(projeKapak(p.id)).replace(/<span class="oynat">.*<\/span>$/, "") : ik("resim")) + '</span>' +
        '<span class="orta"><div class="s1">' + esc(p.baslik) + '</div><div class="s2">' + esc(p.kategori + " · " + g.length + " fotoğraf") + '</div></span></label>';

    '<label class="etiket">Bağlantı ne kadar açık kalsın?</label><div class="secenekler" data-ad="sure">' + PAYLASIM_SURE.map(x =>

    '<div class="hata" id="hata"></div><button class="buton" data-is="paylasKaydet">' + ik("mesaj") + 'Bağlantı oluştur</button></div>';

EYLEM.paylasSec = (el, k) => document.querySelectorAll(".pSec").forEach(x => { x.checked = k === "hepsi" || x.getAttribute("data-kat") === k; });
EYLEM.paylasKaydet = btn => {
  const projeler = Array.from(document.querySelectorAll(".pSec:checked")).map(x => bul("katalog", x.value)).filter(Boolean);
  if(!projeler.length) return hataYaz("En az bir proje seçin.");
  if(!projeler.some(p => projeMedya(p.id).length)) return hataYaz("Seçilen projelerde fotoğraf yok.");
  const o = {projeler, musteriId:deger("cari") || null, baslik:deger("shBaslik") || "Proje kataloğumuz", mesaj:deger("shMesaj"),
    fiyatli:document.getElementById("shFiyat").checked, gun:Number(form.sure) || 0};
  islem(btn, async () => {
    const k = await paylasimOlustur(o);
    history.replaceState(null, "", "#paylasimlar"); ciz(); paylasimPenceresi(k);
  });
};
async function paylasimOlustur(o){
  const id = rastgeleAnahtar(), yollar = [], tum = o.projeler.flatMap(p => projeMedya(p.id));
  try{
    for(let i = 0; i < tum.length; i += 100) await urlleriGetir(tum.slice(i, i + 100));
    const projeler = [];
    for(const p of o.projeler){
      const gorseller = [];
      for(const g of projeMedya(p.id)){
        yuklemeGoster("Fotoğraflar hazırlanıyor " + (yollar.length + 1) + "/" + tum.length + "…");
        const u = urlOnbellek[g.yol]; if(!u) throw new Error("fotoğraf alınamadı");
        const r0 = await fetch(u.url); if(!r0.ok) throw new Error("fotoğraf indirilemedi");
        const hedef = id + "/" + g.id + "_" + guvenliDosyaAdi(g.ad);
        const r = await sb.storage.from(VITRIN).upload(hedef, await r0.blob(), {contentType:g.tur || "image/jpeg", upsert:false});
        if(r.error) throw r.error;
        yollar.push(hedef);
        gorseller.push(sb.storage.from(VITRIN).getPublicUrl(hedef).data.publicUrl);
      }
      if(gorseller.length) projeler.push({baslik:p.baslik, kategori:p.kategori, aciklama:p.aciklama, malzeme:p.malzeme, olcu:p.olcu, fiyat: o.fiyatli ? p.fiyat : 0, gorseller});
    }
    const f = firma();
    const k = {id, baslik:o.baslik, musteriId:o.musteriId, bitis: o.gun ? Date.now() + o.gun * 86400000 : 0, olusma:Date.now(),
      icerik:{baslik:o.baslik, mesaj:o.mesaj, firma:{ad:FIRMA, telefon:f.telefon, adres:f.adres}, projeler, yollar}};
    await Depo.kaydet("paylasimlar", k);
    return k;
  }catch(e){
    if(yollar.length) sb.storage.from(VITRIN).remove(yollar).catch(() => {});
    if(/bucket not found/i.test((e && e.message) || "")) throw new Error("Paylaşım deposu kurulmamış: Supabase'de “supabase-guncelleme-4.sql” dosyasını çalıştırın.");
    throw e;
  }finally{ yuklemeKapat(); }
}
EYLEM.paylasimAc = (el, id) => { const k = bul("paylasimlar", id); if(k) paylasimPenceresi(k); };
function paylasimPenceresi(k){
  const link = paylasimLinki(k), m = bul("musteriler", k.musteriId) || {};
  const p = document.createElement("div"); p.className = "perde";
  p.innerHTML = '<div class="pencere" style="max-width:460px"><p>Bağlantı hazır</p><div class="alt-bilgi">' + esc(k.baslik) + (k.bitis ? ' · son gün ' + msTarih(k.bitis) : '') + '</div>' +
    '<input class="kutu" readonly value="' + esc(link) + '" style="margin-top:12px;font-size:14px" onclick="this.select()">' +
    '<div class="secim-liste"><button class="buton wa-buton" data-k="wa">' + ik("mesaj") + 'WhatsApp ile gönder</button>' +
    '<button class="buton ikincil" data-k="kopyala">' + ik("ataç") + 'Bağlantıyı kopyala</button>' +
    '<a class="buton ikincil" href="' + esc(link) + '" target="_blank" rel="noopener">' + ik("ekran") + 'Müşterinin göreceği sayfayı aç</a>' +
    '<button class="buton ikincil" data-k="kapat">Kapat</button></div></div>';
  p.addEventListener("click", e => {
    const b = e.target.closest("[data-k]");
    if(!b){ if(e.target === p) p.remove(); return; }
    const c = b.getAttribute("data-k");
    if(c === "kopyala"){
      const yedek = () => { const i = p.querySelector("input"); i.select(); try{ document.execCommand("copy"); }catch(x){} bildir("Bağlantı kopyalandı"); };
      if(navigator.clipboard) navigator.clipboard.writeText(link).then(() => bildir("Bağlantı kopyalandı"), yedek); else yedek();
      return;
    }
    p.remove();
    if(c === "wa") waPencere({tel:m.telefon, ad:m.ad, sablonlar:[{ad:"Katalog bağlantısı", metin:"Merhaba" + (m.ad ? " " + m.ad : "") + ", sizin için hazırladığımız örnek projelerimizi bu bağlantıdan inceleyebilirsiniz:\n" + link +
      (k.bitis ? "\n(Bağlantı " + msTarih(k.bitis) + " tarihine kadar açıktır.)" : "") + "\n\n" + FIRMA}]});
  });
  document.body.appendChild(p);
}
EYLEM.paylasimSil = (el, id) => {
  const k = bul("paylasimlar", id); if(!k) return;
  onayla("Bağlantı kapatılsın mı?", "Müşteri bu bağlantıyı artık açamaz; paylaşılan fotoğraf kopyaları silinir. Katalog etkilenmez.", "Kapat", () => islem(null, async () => {
    const yollar = (k.icerik && k.icerik.yollar) || [];
    if(yollar.length){ const r = await sb.storage.from(VITRIN).remove(yollar); if(r.error) throw r.error; }
    await Depo.sil("paylasimlar", id, {cop:false}); bildir("Bağlantı kapatıldı"); ciz();
  }));
};

/* --- Müşterinin gördüğü sayfa (giriş gerekmez) --- */
let vitrinVeri = null;
async function vitrinGoster(anahtar){
  document.body.classList.add("girissiz");
  window.addEventListener("hashchange", () => location.reload());
  const el = document.getElementById("uygulama"), mesaj = (b, a) => {
    el.innerHTML = '<div class="giris-ekrani"><div class="kart" style="text-align:center"><img src="logo.png" alt="' + esc(FIRMA) + '" style="height:40px;margin:0 auto">' +
      '<p style="font-weight:600;margin:16px 0 4px">' + esc(b) + '</p><div class="alt-bilgi">' + esc(a || "") + '</div></div></div>';
  };
  el.innerHTML = '<div class="yukleniyor"><span class="donen"></span>Yükleniyor…</div>';
  if(!sb) return mesaj("İnternet bağlantısı yok gibi görünüyor.", "Bağlantınızı kontrol edip sayfayı yenileyin.");
  let r;
  try{ r = await sb.rpc("vitrin_getir", {anahtar}); }catch(e){ r = {error:e}; }
  if(r.error && /fetch|network|Failed/i.test(r.error.message || "")) return mesaj("İnternet bağlantısı yok gibi görünüyor.", "Bağlantınızı kontrol edip sayfayı yenileyin.");
  if(r.error || !r.data || !Array.isArray(r.data.projeler)) return mesaj("Bu bağlantı geçersiz veya süresi dolmuş.", "Güncel bağlantı için bizimle iletişime geçebilirsiniz.");
  const v = vitrinVeri = r.data, fr = v.firma || {}, tel = waNumara(fr.telefon);
  v.projeler.forEach(p => p.gorseller.forEach(u => { urlOnbellek[u] = {url:u, bitis:Infinity}; }));
  document.title = v.baslik + " — " + (fr.ad || FIRMA);
  const iletisim = (tel ? '<a class="buton wa-buton" href="' + esc(vitrinWaLink(fr.telefon, "“" + v.baslik + "” sayfanızı inceledim, bilgi almak istiyorum.")) + '" target="_blank" rel="noopener">' + ik("mesaj") + 'WhatsApp\'tan yazın</a>' +
    '<a class="buton saydam" href="tel:+' + tel + '">' + ik("telefon") + 'Arayın</a>' : '');
  el.innerHTML = '<main class="sayfa" style="max-width:1100px">' +
    '<div class="vitrin"><div class="marka"><img src="logo-beyaz.png" alt="' + esc(fr.ad || FIRMA) + '"></div>' +
      '<h1 style="font-size:22px;margin:14px 0 4px;position:relative">' + esc(v.baslik) + '</h1>' +
      (v.mesaj ? '<div class="alt" style="white-space:pre-wrap">' + esc(v.mesaj) + '</div>' : '<div class="alt"></div>') +
      '<div class="buton-sira"><button class="buton altin" data-is="vitrinSunum" data-arg="-1">' + ik("oynat") + 'Tüm fotoğrafları izle</button>' + iletisim + '</div></div>' +
    '<div class="proje-izgara">' + v.projeler.map((p, i) => '<button class="proje-kart" data-is="vitrinSunum" data-arg="' + i + '"><span class="kapak">' + (() => { const k = p.gorseller.find(u => !videoMu({yol:u})) || p.gorseller[0];
        return videoMu({yol:k}) ? '<video src="' + esc(k) + '#t=0.1" muted playsinline preload="metadata"></video>' : '<img src="' + esc(k) + '" loading="lazy" alt="' + esc(p.baslik) + '">'; })() +
      '<span class="sayi">' + p.gorseller.length + (p.gorseller.some(u => videoMu({yol:u})) ? ' medya' : ' foto') + '</span></span><span class="pk"><b>' + esc(p.baslik) + '</b><span>' + esc([p.kategori, p.malzeme].filter(Boolean).join(" · ")) + '</span>' +
      (p.fiyat ? '<span style="color:var(--yazi);font-weight:600;margin-top:2px;white-space:normal">' + 'Başlangıç: ' + para(p.fiyat) + ' + KDV</span>' : '') + '</span></button>').join("") + '</div>' +
    '<div class="alt-bilgi" style="text-align:center;margin:28px 0 12px">' + esc([fr.ad || FIRMA, fr.adres, fr.telefon].filter(Boolean).join(" · ")) + '</div></main>';
}
EYLEM.vitrinSunum = (el, i) => {
  if(!vitrinVeri) return;
  const n = Number(i), pl = n >= 0 ? [vitrinVeri.projeler[n]] : vitrinVeri.projeler;
  sunumAc(pl.flatMap(p => p.gorseller.map(u => ({g:{yol:u}, p}))), 0, {telefon:(vitrinVeri.firma || {}).telefon});
};

  const h = isHesap(ie.kalemler, isTeklif(ie)), fiyatli = h.kalemli;

  document.querySelectorAll(".baski").forEach(x => x.remove());
  const b = document.createElement("div"); b.className = "baski";
  const toplamSatir = (k, v, kalin) => '<tr' + (kalin ? ' style="font-size:16px;font-weight:700"' : '') + '><td style="text-align:right;border:0">' + k + '</td><td style="text-align:right;border:0;white-space:nowrap;width:140px">' + v + '</td></tr>';

    '<div>Sayın <b>' + esc(m.ad || "") + '</b>' + (m.telefon ? ' · ' + esc(m.telefon) : '') + (ie.adres ? '<br>' + esc(ie.adres) : '') + '</div>' +
    '<h2>' + esc(ie.baslik) + '</h2>' +
    (ie.kalemler.length ? '<table><tr><th>Ürün</th><th>Ölçü</th><th>Malzeme / renk</th><th>Adet</th>' + (fiyatli ? '<th style="text-align:right">Birim fiyat</th><th style="text-align:right">Tutar</th>' : '') + '</tr>' +
      ie.kalemler.map(k => '<tr><td>' + esc(k.ad) + '</td><td>' + esc(k.olcu) + '</td><td>' + esc(k.renk) + '</td><td>' + k.adet + '</td>' +

      '</table>' : '') +
    (h.ara > 0 ? '<table style="margin-top:6px">' + toplamSatir(h.kalemli ? "Ara toplam" : "Fiyat (KDV hariç)", para(h.ara)) + (h.indirim ? toplamSatir("İndirim", "−" + para(h.indirim)) : '') +
      toplamSatir(kdvYazi(h.kdvOran), para(h.kdv)) + toplamSatir("Genel toplam" + (h.kdvOran ? " (KDV dahil)" : ""), para(h.toplam), true) + '</table>' :
      o.fiyat ? '<div class="toplam">Toplam: ' + para(o.fiyat) + '</div>' : '') +
    (ie.aciklama ? '<p style="white-space:pre-wrap">' + esc(ie.aciklama) + '</p>' : '') +
    '<p>' + [ie.teslimTarihi ? 'Tahmini teslim: <b>' + esc(tamTarih(ie.teslimTarihi)) + '</b>' : '', ie.teklif.gecerlilik ? 'Teklif geçerlilik tarihi: <b>' + esc(tamTarih(ie.teklif.gecerlilik)) + '</b>' : ''].filter(Boolean).join("<br>") + '</p>' +
    (fr.teklifNotu ? '<p style="white-space:pre-wrap">' + esc(fr.teklifNotu) + '</p>' : '') +

    (fotolar.length ? '<h2>Görseller</h2><div class="b-foto">' + fotolar.map(x => urlOnbellek[x.yol] ? '<img src="' + esc(urlOnbellek[x.yol].url) + '" alt="">' : '').join("") + '</div>' : '') +
    '<div style="display:flex;justify-content:space-between;margin-top:40px"><div>Müşteri onayı<br><br>……………………</div><div style="text-align:right">' + esc(FIRMA) + '<br><br>……………………</div></div>';
  document.body.appendChild(b);
  await Promise.all(Array.from(b.querySelectorAll("img")).map(x => x.complete ? 0 : new Promise(r => { x.onload = x.onerror = r; setTimeout(r, 5000); })));
  const temizle = () => { b.remove(); document.body.classList.remove("teklif-baski"); window.removeEventListener("afterprint", temizle); };
  window.addEventListener("afterprint", temizle);
  document.body.classList.add("teklif-baski");
  window.print();
};

/* ================= FATURALAR ================= */
function ekranFaturalar(){
  const ay = veri.faturalar.filter(f => f.tarih.slice(0, 7) === ayGoster);
  const liste = ay.filter(f => filtre.fatura === "hepsi" || f.tur === filtre.fatura).sort(tarihSira);
  let satis = 0, alis = 0, odenmemis = 0;
  ay.forEach(f => { if(f.tur === "satis") satis += f.toplam; else alis += f.toplam; });
  veri.faturalar.forEach(f => { if(f.tur === "satis") odenmemis += odemeDurumu(f).kalan; });
  const html = '<div class="izgara uc"><div class="kart ozet"><div class="kart-baslik">Bu ay satış faturaları</div><div class="deger t-giris">' + para(satis) + '</div></div>' +

/* ================= PERSONEL ================= */
// Hesap: hakediş ve prim personelin alacağını artırır; avans, ödeme ve kesinti azaltır.
// Ödeme ve avans kasaya "Personel Maaşı" gideri olarak da işlenir (hareketId ile bağlı).
const UCRET_TIPI = {aylik:"Aylık maaş", haftalik:"Haftalık ücret", gunluk:"Günlük yevmiye"};
const PUANTAJ = [["geldi", "Geldi"], ["yarim", "Yarım gün"], ["gelmedi", "Gelmedi"], ["izinli", "Ücretli izin"], ["ucretsiz", "Ücretsiz izin"], ["raporlu", "Raporlu"], ["tatil", "Tatil"]];
const PUANTAJ_RENK = {geldi:"#16a34a", yarim:"#f59e0b", gelmedi:"#dc2626", izinli:"#2563eb", ucretsiz:"#9ca3af", raporlu:"#7c3aed", tatil:"#0d9488"};
const PH_TUR = {hakedis:["Hakediş", 1], prim:["Prim", 1], kesinti:["Kesinti", -1], avans:["Avans", -1], odeme:["Ödeme", -1]};
const PERSONEL_AYAR = {haftaGun:6, gunSaat:9, mesaiKat:1.5};
function personelAyar(){
  const a = veri.ayarlar.find(x => x.anahtar === "personelAyar");
  return Object.assign({}, PERSONEL_AYAR, a && a.deger && typeof a.deger === "object" ? a.deger : {});
}
const tarihOku = t => { const p = t.split("-"); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); };
const gunEkle = (t, n) => { const d = tarihOku(t); d.setDate(d.getDate() + n); return tarihStr(d); };
const haftaBasi = t => { const d = tarihOku(t); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return tarihStr(d); };
const ayGunSayisi = ay => new Date(Number(ay.slice(0, 4)), Number(ay.slice(5, 7)), 0).getDate();
const GUN_ADI = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
const calisiyor = (p, t) => (!p.giris || p.giris <= t) && (!p.cikis || p.cikis >= t);
const personelHareketleri = id => veri.personel_hareket.filter(h => h.personelId === id).sort(tarihSira);
function personelBakiye(id){
  return yuvarla(veri.personel_hareket.reduce((t, h) => h.personelId === id && PH_TUR[h.tur] ? t + PH_TUR[h.tur][1] * h.tutar : t, 0));
}
function donemBilgi(tip, bas){
  if(tip === "ay"){ const ay = bas.slice(0, 7); return {anahtar:ay, bas:ay + "-01", bit:ay + "-" + ("0" + ayGunSayisi(ay)).slice(-2), ad:AYLAR[Number(ay.slice(5, 7)) - 1] + " " + ay.slice(0, 4)}; }
  const h = haftaBasi(bas), bit = gunEkle(h, 6), kisa = t => Number(t.slice(8)) + " " + AYLAR[Number(t.slice(5, 7)) - 1];
  return {anahtar:"H" + h, bas:h, bit, ad:kisa(h) + " – " + kisa(bit) + " " + bit.slice(0, 4)};
}
const donemAdi = d => d.charAt(0) === "H" ? donemBilgi("hafta", d.slice(1)).ad + " haftası" : donemBilgi("ay", d).ad;
// Dönem hakedişi. Aylık / haftalık personelde işaretlenmeyen gün "geldi" sayılır; yevmiyelide sadece işaretli günler ödenir.
function hakedisHesap(p, bas, bit){
  const ay = personelAyar(), kayit = {}, sayac = {}; let gun = 0, isaretsiz = 0, mesai = 0;
  veri.puantaj.forEach(x => { if(x.personelId === p.id && x.tarih >= bas && x.tarih <= bit) kayit[x.tarih] = x; });
  for(let t = bas; t <= bit; t = gunEkle(t, 1)){
    if(!calisiyor(p, t)) continue;
    gun++;
    const k = kayit[t];
    if(!k){ isaretsiz++; continue; }
    sayac[k.durum] = (sayac[k.durum] || 0) + 1; mesai += k.mesai || 0;
  }
  const s = d => sayac[d] || 0, toplamGun = Math.round((tarihOku(bit) - tarihOku(bas)) / 86400000) + 1;
  const gunluk = p.ucretTipi === "aylik" ? p.ucret / 30 : p.ucretTipi === "haftalik" ? p.ucret / ay.haftaGun : p.ucret;
  let temel, kesinti = 0;
  if(p.ucretTipi === "gunluk") temel = gunluk * (s("geldi") + s("izinli") + s("yarim") / 2);
  else {
    temel = p.ucret * gun / toplamGun;   // dönemin tamamında çalıştıysa tam ücret
    kesinti = gunluk * (s("gelmedi") + s("ucretsiz") + s("raporlu") + s("yarim") / 2);
  }
  const mesaiUcret = mesai * gunluk / ay.gunSaat * ay.mesaiKat;
  return {gun, isaretsiz, sayac, mesai, gunluk:yuvarla(gunluk), temel:yuvarla(temel), kesinti:yuvarla(kesinti), mesaiUcret:yuvarla(mesaiUcret),
    toplam:yuvarla(Math.max(0, temel - kesinti + mesaiUcret))};
}
const puantajOzet = h => PUANTAJ.filter(x => h.sayac[x[0]]).map(x => h.sayac[x[0]] + " " + x[1].toLocaleLowerCase("tr")).concat(h.mesai ? [sayiYaz(h.mesai) + " saat mesai"] : []).join(" · ");
const personelEksik = () => eksikTablo.personel || eksikTablo.puantaj || eksikTablo.personel_hareket;
const personelUyari = () => '<div class="uyari">Personel bölümü için Supabase\'de <b>supabase-guncelleme-5.sql</b> dosyasını çalıştırın, sonra sayfayı yenileyin.</div>';

async function personelOdemeKaydet(p, tur, tutar, o){
  let hid = null;

  }

}

EYLEM.phEkle = (el, arg) => {

    '<div class="iki-alan"><div>' + tarihAlani("phTarih", "Tarih", bugun()) + '</div>' +
    (kasa_ ? '<div><label class="etiket" for="phOdeme">Ödeme şekli</label><select id="phOdeme" class="kutu">' + ODEME.map(o => '<option>' + o + '</option>').join("") + '</select></div>' : '<div></div>') + '</div>' +
    '<label class="etiket" for="phAciklama">Açıklama <span class="ist">(isteğe bağlı)</span></label><input id="phAciklama" class="kutu" maxlength="200">' +
    '<div class="hata" id="phHata"></div><div class="buton-sira"><button class="buton ikincil" data-c="hayir">Vazgeç</button><button class="buton" data-c="kaydet">' + ik("tamam") + 'Kaydet</button></div></div>';
  pp.addEventListener("click", e => {
    const b = e.target.closest("[data-c]");
    if(!b){ if(e.target === pp) pp.remove(); return; }
    if(b.getAttribute("data-c") === "hayir") return pp.remove();
    const tutar = sayiOku(pp.querySelector("#phTutar").value);

    b.disabled = true;
    personelOdemeKaydet(p, tur, yuvarla(tutar), {tarih:pp.querySelector("#phTarih").value || bugun(), aciklama:pp.querySelector("#phAciklama").value.trim(),

  const sonra = tip === "ay" ? gunEkle(d.bit, 1) : gunEkle(d.bas, 7);

      '<div class="alt-bilgi" style="margin:0 0 6px">' + (puantajOzet(hes) || "Puantaj kaydı yok") + (hes.isaretsiz ? ' · ' + hes.isaretsiz + ' gün işaretsiz' + (p.ucretTipi === "gunluk" ? ' <b style="color:#b91c1c">(ödenmez)</b>' : ' (geldi sayıldı)') : '') + '</div>' +

    (kisiler.length ? satirlar.join("") + '<div class="kart ozet"><div class="kart-baslik">Bu dönem toplam ödenecek</div><div class="deger">' + para(toplamOdenecek) + '</div></div>' :
      '<div class="kart">' + bos("kisiler", tip === "ay" ? "Aylık maaşlı personel yok." : "Haftalık veya yevmiyeli personel yok.") + '</div>');
  return {baslik:"Maaş / ödeme", geri:true, html};

/* ================= MONTAJ VE TESLİMAT TAKVİMİ ================= */
// Randevular iş emrinin "montaj" alanında: [{id, tarih, saat, sure (saat; 0 = tüm gün), tur, ekip:[ad], not, hatirlatildi, tamam}]
const RANDEVU_TUR = ["Montaj", "Teslimat", "Ölçü / keşif", "Servis"];
const RANDEVU_RENK = {"Montaj":"var(--ana)", "Teslimat":"var(--borc)", "Ölçü / keşif":"#7c3aed", "Servis":"#0d9488"};
const GUN_UZUN = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
const trKucuk = s => String(s || "").toLocaleLowerCase("tr").trim();
// Montaja gidebilecek kişiler: çalışan personel, kullanıcı adları, iş emirlerindeki sorumlular
function ekipListesi(){
  const l = veri.personel.filter(p => calisiyor(p, bugun())).map(p => p.ad)
    .concat(yetki.liste.map(k => k.ad), veri.is_emirleri.map(i => i.sorumlu), veri.is_emirleri.flatMap(i => i.montaj.flatMap(r => r.ekip || [])));
  const g = {}; return l.filter(Boolean).filter(a => { const k = trKucuk(a); if(g[k]) return false; g[k] = 1; return true; }).sort((a, b) => a.localeCompare(b, "tr"));
}
const randevular = () => veri.is_emirleri.flatMap(ie => (ie.montaj || []).map(r => ({ie, r})));
const dakika = s => { const m = /^(\d{1,2}):(\d{2})/.exec(s || ""); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
// Saat yazılmamışsa veya "tüm gün" ise 08:00–18:00 sayılır
function randevuAraligi(r){
  const b = dakika(r.saat); if(b == null || !r.sure) return [8 * 60, 18 * 60];
  return [b, b + Math.round(r.sure * 60)];
}
// Aynı gün, saatleri çakışan ve ortak ekip üyesi olan diğer randevular
function cakisanlar(r, haric){
  const a = randevuAraligi(r), ekip = (r.ekip || []).map(trKucuk);
  if(!ekip.length) return [];
  return randevular().filter(x => x.r.id !== r.id && x.r.id !== haric && x.r.tarih === r.tarih && !x.r.tamam && x.ie.durum !== "İptal").filter(x => {
    const b = randevuAraligi(x.r); if(!(a[0] < b[1] && b[0] < a[1])) return false;
    return (x.r.ekip || []).some(e => ekip.indexOf(trKucuk(e)) >= 0);
  });
}
const saatYazi = r => r.saat ? r.saat + (r.sure ? "–" + (() => { const s = randevuAraligi(r)[1]; return ("0" + Math.floor(s / 60) % 24).slice(-2) + ":" + ("0" + s % 60).slice(-2); })() : "") : "Tüm gün";
const benimAdim = () => trKucuk(yetki.ad);
const bendeMi = (ie, r) => { const b = benimAdim(); return !!b && ((r && (r.ekip || []).some(e => trKucuk(e) === b)) || trKucuk(ie.sorumlu) === b); };
const haritaLink = adres => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(adres);

function randevuKarti(x, o = {}){

/* ================= SESLE NOT ================= */
// Tarayıcının konuşma tanıma özelliği (Chrome, Edge, Safari). Ses telefondan çıkmaz; yazıya çevirme tarayıcıda / cihaz servisinde yapılır.
const SesTanima = window.SpeechRecognition || window.webkitSpeechRecognition;
let sesAktif = null;
function sesleYaz(kutu, dugme){
  if(sesAktif){ sesAktif.stop(); return; }
  if(!SesTanima) return uyar("Bu tarayıcı sesle yazmayı desteklemiyor", "Telefon klavyesindeki mikrofon tuşuna basarak da konuşarak yazabilirsiniz. Chrome veya Safari'de bu düğme çalışır.");
  const t = new SesTanima(); t.lang = "tr-TR"; t.continuous = true; t.interimResults = true;
  const bas = kutu.value ? kutu.value.replace(/\s*$/, " ") : "", eskiYazi = dugme.innerHTML;
  let kesin = "";
  t.onresult = e => {
    let ara = "";
    for(let i = e.resultIndex; i < e.results.length; i++){ if(e.results[i].isFinal) kesin += e.results[i][0].transcript + " "; else ara += e.results[i][0].transcript; }
    kutu.value = bas + kesin + ara;
  };
  t.onerror = e => { if(e.error === "not-allowed" || e.error === "service-not-allowed") uyar("Mikrofon izni verilmedi", "Tarayıcının site ayarlarından mikrofona izin verin."); else if(e.error !== "no-speech" && e.error !== "aborted") bildir("Ses tanınamadı: " + e.error); };
  t.onend = () => { sesAktif = null; dugme.classList.remove("dinliyor"); dugme.innerHTML = eskiYazi; kutu.value = kutu.value.trim(); };
  sesAktif = t; t.start();
  dugme.classList.add("dinliyor"); dugme.innerHTML = ik("mikrofon") + "Dinliyorum… bitirmek için dokunun";
}

// Türkçe harfleri sadeleştirir: "Güneş" ile "gunes" eşleşir
const sade = s => String(s || "").toLocaleLowerCase("tr").replace(/[çğıöşüâî]/g, c => ({ç:"c", ğ:"g", ı:"i", ö:"o", ş:"s", ü:"u", â:"a", î:"i"}[c]));
function aramaSonuclari(q){

  const telUyar = t => rakam.length >= 4 && String(t || "").replace(/\D/g, "").indexOf(rakam.replace(/^0/, "")) >= 0;
  const g = [];
  const ekle = (baslik, l) => { if(l.length) g.push({baslik, l:l.slice(0, 8), fazla:l.length - 8}); };
  if(Y) ekle("Cariler", veri.musteriler.filter(m => uyar_(m.ad, m.adres, m.vergiNo) || telUyar(m.telefon)).map(m => ({yer:"cari/" + m.id, ikon:"kisi", s1:m.ad, s2:[m.tip === "tedarikci" ? "Tedarikçi" : "Müşteri", m.telefon].filter(Boolean).join(" · ")})));
  ekle("İş emirleri", veri.is_emirleri.filter(ie => uyar_(ie.no, ie.baslik, ie.adres, ie.sorumlu, ie.kategori, cariAdi(ie.musteriId), ie.kalemler.map(k => k.ad).join(" ")) || telUyar((bul("musteriler", ie.musteriId) || {}).telefon))
    .sort((a, b) => b.olusma - a.olusma).map(ie => ({yer:"is/" + ie.id, ikon:"is", s1:ie.no + " · " + ie.baslik, s2:[cariAdi(ie.musteriId), ie.durum].join(" · ")})));
  if(Y) ekle("Faturalar", veri.faturalar.filter(f => uyar_(f.no, cariAdi(f.musteriId), f.aciklama) || (rakam && String(Math.round(f.toplam)) === rakam)).sort((a, b) => a.tarih < b.tarih ? 1 : -1)
    .map(f => ({yer:"fatura/" + f.id, ikon:"fatura", s1:f.no + " · " + cariAdi(f.musteriId), s2:(f.tur === "satis" ? "Satış" : "Alış") + " · " + tarihYaz(f.tarih, true) + " · " + para(f.toplam)})));
  ekle("Katalog", veri.katalog.filter(p => uyar_(p.baslik, p.kategori, p.malzeme, p.aciklama)).map(p => ({yer:"proje/" + p.id, ikon:"katalog", s1:p.baslik, s2:p.kategori})));
  if(Y) ekle("Personel", veri.personel.filter(p => uyar_(p.ad, p.gorev) || telUyar(p.telefon)).map(p => ({yer:"personel/" + p.id, ikon:"kisi", s1:p.ad, s2:p.gorev || ""})));
  if(Y) ekle("Kasa", veri.hareketler.filter(h => h.tur !== "borc" && (uyar_(h.aciklama, h.kategori, cariAdi(h.musteriId)) || (rakam.length >= 2 && String(Math.round(h.tutar)) === rakam))).sort(tarihSira)
    .map(h => ({yer:"kayit/" + h.id, ikon:h.tur === "giris" ? "asagi" : "yukari", s1:(h.tur === "giris" ? "+" : "−") + para(h.tutar) + " · " + (h.kategori || ""), s2:[tarihYaz(h.tarih, true), cariAdi(h.musteriId), h.aciklama].filter(Boolean).join(" · ")})));
  if(Y) ekle("Çek / senet", veri.cekler.filter(c => uyar_(c.no, c.banka, c.kesideci, cariAdi(c.musteriId)) || (rakam.length >= 2 && String(Math.round(c.tutar)) === rakam))
    .map(c => ({yer:"cekler/" + c.id, ikon:"kasa", s1:(c.belge === "senet" ? "Senet " : "Çek ") + (c.no || "") + " · " + para(c.tutar), s2:[cariAdi(c.musteriId), "vade " + tarihYaz(c.vade, true), CEK_DURUM[c.durum]].filter(Boolean).join(" · ")})));

  return g;

function aramaAc(){

  };
  const ac_ = yer => { p.remove(); git(yer); };

    if(e.target === p || e.target.closest("[data-c]")) p.remove();
  });

}

/* ================= PROJE KÂRLILIĞI ================= */
// Tüm tutarlar KDV hariç. Maliyet kaynakları: işe bağlı alış faturaları, işe bağlı kasa giderleri (faturasız),
// stoktan işe çıkan malzeme (maliyet fiyatıyla) ve iş emrine elle yazılan maliyetler (kendi ustanızın işçiliği vb.).
const MALIYET_GRUP = {malzeme:"Malzeme", iscilik:"İşçilik", nakliye:"Nakliye / montaj", diger:"Diğer"};
const MALIYET_RENK = {malzeme:"var(--ana)", iscilik:"var(--borc)", nakliye:"#0d9488", diger:"#a8a29e"};
const giderGrubu = kat => /hammadde|mdf|sunta|kereste|kumaş|sünger|aksesuar|hırdavat|boya|cila|malzeme|tedarik/i.test(kat || "") ? "malzeme" :
  /usta|işçilik|iscilik|personel|maaş/i.test(kat || "") ? "iscilik" : /nakliye|montaj|kargo|yakıt/i.test(kat || "") ? "nakliye" : "diger";
function isNetSatis(ie){
  const fs = veri.faturalar.filter(f => f.isEmriId === ie.id && f.tur === "satis");
  return yuvarla(fs.length ? fs.reduce((t, f) => t + f.araToplam, 0) : isHesap(ie.kalemler, isTeklif(ie)).net);

function isKarlilik(ie){
  const kalemler = [], ml = malzemeListesi();
  veri.faturalar.filter(f => f.isEmriId === ie.id && f.tur === "alis").forEach(f => kalemler.push({grup:giderGrubu(f.kategori || "malzeme") === "diger" ? "malzeme" : giderGrubu(f.kategori), ad:"Alış faturası " + f.no + " · " + cariAdi(f.musteriId), tutar:f.araToplam, yer:"fatura/" + f.id}));
  veri.hareketler.filter(h => h.isEmriId === ie.id && h.tur === "cikis" && !(h.faturaId && bul("faturalar", h.faturaId)))
    .forEach(h => kalemler.push({grup:giderGrubu(h.kategori), ad:(h.kategori || "Gider") + (h.aciklama ? " · " + h.aciklama : ""), tutar:h.tutar, yer:"kayit/" + h.id}));
  veri.stok_hareket.filter(h => h.isEmriId === ie.id && h.tur === "cikis").forEach(h => {
    const m = ml.find(x => x.id === h.malzemeId); if(!m || !m.fiyat) return;
    kalemler.push({grup:"malzeme", ad:"Stoktan: " + m.ad + " (" + miktarYaz(-h.miktar) + " " + m.birim + ")", tutar:yuvarla(-h.miktar * m.fiyat), yer:"stok"});

  const gruplar = {malzeme:0, iscilik:0, nakliye:0, diger:0};
  kalemler.forEach(k => { gruplar[k.grup] = yuvarla(gruplar[k.grup] + k.tutar); });
  const satis = isNetSatis(ie), maliyet = yuvarla(Object.values(gruplar).reduce((t, v) => t + v, 0)), kar = yuvarla(satis - maliyet), o = isOzet(ie.id);
  return {satis, maliyet, kar, marj: satis ? kar / satis * 100 : 0, gruplar, kalemler, tahsilat:o.tahsilat, kalan:o.kalan,

/* ================= KESİM LİSTESİ VE PLAKA OPTİMİZASYONU ================= */
// İş emrinin "kesim" alanı: {parcalar:[{id, ad, en, boy, adet, malzemeId, damar, bantU, bantK}], testere, pay}
// Ölçüler mm. "damar": desen yönü korunur (parça döndürülmez). bantU / bantK: bantlanan uzun / kısa kenar sayısı (0–2).
const VARSAYILAN_PLAKA = {id:"", ad:"Plaka 2100×2800 (malzeme seçilmedi)", en:2100, boy:2800, fiyat:0, birim:"plaka"};
const plakaMalzemeleri = () => malzemeListesi().filter(m => m.birim === "plaka").map(m => Object.assign({}, m, {en:m.en || 2100, boy:m.boy || 2800}));
const plakaBul = id => plakaMalzemeleri().find(m => m.id === id) || VARSAYILAN_PLAKA;

// MaxRects (en kısa kenar uyumu): parçalar büyükten küçüğe yerleştirilir; testere payı her parçaya eklenir.
function kesimHesapla(parcalar, o){
  const testere = Number(o.testere) || 0, pay = Number(o.pay) || 0, sonuc = {};
  const gruplar = {};
  parcalar.forEach((p, i) => { if(!(p.en > 0 && p.boy > 0 && p.adet > 0)) return; (gruplar[p.malzemeId || ""] = gruplar[p.malzemeId || ""] || []).push(Object.assign({no:i + 1}, p)); });
  for(const [mid, l] of Object.entries(gruplar)){
    const m = plakaBul(mid), W = m.en - 2 * pay + testere, H = m.boy - 2 * pay + testere;
    const tek = [];
    l.forEach(p => { for(let k = 0; k < p.adet; k++) tek.push(p); });
    // Birkaç sıralama ve yerleştirme kuralı denenir; en az plaka, sonra son plakası en boş olan seçilir
    const sira = [
      (a, b) => Math.max(b.en, b.boy) - Math.max(a.en, a.boy) || b.en * b.boy - a.en * a.boy,
      (a, b) => b.en * b.boy - a.en * a.boy,
      (a, b) => b.boy - a.boy || b.en - a.en,
      (a, b) => b.en - a.en || b.boy - a.boy,
      (a, b) => (b.damar ? 1 : 0) - (a.damar ? 1 : 0) || b.en * b.boy - a.en * a.boy,
      (a, b) => Math.min(b.en, b.boy) - Math.min(a.en, a.boy) || b.en * b.boy - a.en * a.boy];
    let en = null;
    for(const s of sira) for(const kural of ["kisa", "alan"]){
      const dizi = tek.slice().sort(s), pls = [], sig = [];
      for(const p of dizi){
        const w = p.en + testere, h = p.boy + testere, don = !p.damar;
        let yer = null;
        for(const pl of pls){ yer = mrBul(pl, w, h, don, kural); if(yer){ mrKoy(pl, yer, p); break; } }
        if(!yer){
          const pl = {free:[{x:0, y:0, w:W, h:H}], used:[]};
          yer = mrBul(pl, w, h, don, kural);
          if(!yer){ if(sig.indexOf(p) < 0) sig.push(p); continue; }
          mrKoy(pl, yer, p); pls.push(pl);
        }
      }
      const sonDoluluk = pls.length ? pls[pls.length - 1].used.reduce((t, u) => t + u.w * u.h, 0) : 0;
      if(!en || pls.length < en.pls.length || (pls.length === en.pls.length && sonDoluluk < en.son)) en = {pls, sig, son:sonDoluluk};
    }
    const plakalar = en ? en.pls : [], sigmayan = en ? en.sig : [];
    const alan = plakalar.length * m.en * m.boy, kullanilan = plakalar.reduce((t, pl) => t + pl.used.reduce((a, u) => a + u.p.en * u.p.boy, 0), 0);
    const bant = tek.reduce((t, p) => t + ((p.bantU || 0) * Math.max(p.en, p.boy) + (p.bantK || 0) * Math.min(p.en, p.boy)) / 1000, 0);
    sonuc[mid] = {m, plakalar:plakalar.map(pl => pl.used), sigmayan, parcaSayisi:tek.length, kullanim: alan ? kullanilan / alan * 100 : 0,
      fireM2:(alan - kullanilan) / 1e6, kullanilanM2:kullanilan / 1e6, bant, maliyet:plakalar.length * (m.fiyat || 0), pay, testere};
  }
  return sonuc;
}
function mrBul(pl, w, h, don, kural){
  let en = null;
  const dene = (fr, ww, hh, dondu) => {
    if(ww > fr.w + 1e-6 || hh > fr.h + 1e-6) return;
    const kisa = kural === "alan" ? fr.w * fr.h - ww * hh : Math.min(fr.w - ww, fr.h - hh), uzun = kural === "alan" ? Math.min(fr.w - ww, fr.h - hh) : Math.max(fr.w - ww, fr.h - hh);
    if(!en || kisa < en.kisa || (kisa === en.kisa && uzun < en.uzun) || (kisa === en.kisa && uzun === en.uzun && fr.y + fr.x < en.y + en.x))
      en = {x:fr.x, y:fr.y, w:ww, h:hh, dondu, kisa, uzun};
  };
  pl.free.forEach(fr => { dene(fr, w, h, false); if(don && w !== h) dene(fr, h, w, true); });
  return en;
}
function mrKoy(pl, r, p){
  pl.used.push({x:r.x, y:r.y, w:r.w, h:r.h, dondu:r.dondu, p});
  const yeni = [];
  pl.free.forEach(f => {
    if(r.x >= f.x + f.w || r.x + r.w <= f.x || r.y >= f.y + f.h || r.y + r.h <= f.y){ yeni.push(f); return; }
    if(r.x > f.x) yeni.push({x:f.x, y:f.y, w:r.x - f.x, h:f.h});
    if(r.x + r.w < f.x + f.w) yeni.push({x:r.x + r.w, y:f.y, w:f.x + f.w - r.x - r.w, h:f.h});
    if(r.y > f.y) yeni.push({x:f.x, y:f.y, w:f.w, h:r.y - f.y});
    if(r.y + r.h < f.y + f.h) yeni.push({x:f.x, y:r.y + r.h, w:f.w, h:f.y + f.h - r.y - r.h});
  });
  pl.free = yeni.filter((a, i) => a.w > 1 && a.h > 1 && !yeni.some((b, j) => j !== i && b.x <= a.x && b.y <= a.y && b.x + b.w >= a.x + a.w && b.y + b.h >= a.y + a.h && (j < i || b.w * b.h > a.w * a.h)));
}
function plakaSvg(m, used, sira, toplam, o){
  const pay = o.pay || 0, t = o.testere || 0, fs = Math.max(28, Math.min(m.en, m.boy) / 40);
  const parca = used.map(u => {
    const w = u.w - t, h = u.h - t, x = pay + u.x, y = pay + u.y, olcu = (u.dondu ? u.p.boy + "×" + u.p.en : u.p.en + "×" + u.p.boy);
    const yazi = Math.min(fs, w / 6, h / 2.4);
    return '<g><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" class="kp' + (u.p.damar ? ' damar' : '') + '"/>' +
      (yazi > 9 ? '<text x="' + (x + w / 2) + '" y="' + (y + h / 2) + '" font-size="' + yazi + '" text-anchor="middle" dominant-baseline="middle"><tspan font-weight="700">' + u.p.no + '</tspan> ' + esc(olcu) + '</text>' +
        (h > yazi * 3 && w > yazi * 8 ? '<text x="' + (x + w / 2) + '" y="' + (y + h / 2 + yazi * 1.2) + '" font-size="' + yazi * .8 + '" text-anchor="middle" dominant-baseline="middle" class="kp-ad">' + esc(String(u.p.ad || "").slice(0, 24)) + (u.dondu ? ' ↻' : '') + '</text>' : '') : '') + '</g>';
  }).join("");
  return '<div class="plaka"><div class="plaka-baslik"><b>' + esc(m.ad) + ' — plaka ' + sira + '/' + toplam + '</b><span>' + m.en + ' × ' + m.boy + ' mm · ' + used.length + ' parça · doluluk %' +
    Math.round(used.reduce((a, u) => a + u.p.en * u.p.boy, 0) / (m.en * m.boy) * 100) + '</span></div>' +
    '<svg viewBox="-10 -10 ' + (m.en + 20) + ' ' + (m.boy + 20) + '" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="' + m.en + '" height="' + m.boy + '" class="kp-plaka"/>' + parca + '</svg></div>';
}
// "220x240x60" → en, boy, derinlik (mm). 1000'den küçük sayılar santimetre sayılır.
function olcuOku(s){
  const l = String(s || "").replace(/,/g, ".").match(/\d+(\.\d+)?/g); if(!l || l.length < 2) return null;
  const n = l.slice(0, 3).map(Number), cm = n.every(v => v < 1000);
  return n.map(v => Math.round(cm ? v * 10 : v));
}

const DOLAP_TIP = {alt:"Alt dolap", ust:"Üst dolap", boy:"Boy dolap / gardırop", kutu:"Kutu / raf ünitesi"};
function dolapParcalari(d){
  const t = d.kalinlik || 18, W = d.en, H = d.boy, D = d.derinlik, ic = W - 2 * t, n = d.adet || 1, l = [], ad = d.ad ? d.ad + " · " : "";
  const p = (a, en, boy, adet, ek) => { if(en > 0 && boy > 0 && adet > 0) l.push(Object.assign({id:yeniId(), ad:ad + a, en:Math.round(en), boy:Math.round(boy), adet:adet * n, malzemeId:d.govde || "", damar:false, bantU:1, bantK:0}, ek || {})); };
  p("Yan", D, H, 2);
  p("Alt tabla", ic, D, 1);
  if(d.tip === "alt") p("Kuşak", ic, 100, 2, {bantU:0});
  else p("Üst tabla", ic, D, 1);
  if(d.raf) p("Raf", ic - 2, D - 20, d.raf);
  if(d.arkalik) p("Arkalık", W - 4, H - 4, 1, {malzemeId:d.arkalik, bantU:0});
  if(d.kapak){
    const ke = (W - 4 - (d.kapak - 1) * 3) / d.kapak;
    p("Kapak", ke, H - 4, d.kapak, {malzemeId:d.kapakMalzeme || d.govde || "", damar:true, bantU:2, bantK:2});
  }
  return l;
}

// İnternet yokken son eşitlenen veri cihazdan (IndexedDB) açılır; kayıtlar sıraya alınır ve internet gelince sırayla gönderilir.
let cevrimdisi = false, kuyruk = [], gonderiliyor = false, sonEsitleme = 0;
const agHatasi = e => /failed to fetch|fetch failed|networkerror|network request failed|load failed|err_internet|err_network|internet bağlantısı/i.test(String((e && (e.message || e.details)) || e));
const IDB = {
  ac(){ return this.p || (this.p = new Promise((res, rej) => { const r = indexedDB.open("gunes-mobilya", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
  async al(k){ try{ const db = await this.ac(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); }catch(e){ return undefined; } },
  async yaz(k, v){ try{ const db = await this.ac(); await new Promise(res => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = res; }); }catch(e){} }
};
function bulutIslem(o){
  const q = sb.from(o.tablo);
  return o.tip === "upsert" ? q.upsert(o.satirlar) : o.tip === "insert" ? q.insert(o.satirlar) : o.tip === "update" ? q.update(o.satir).eq(o.anahtar, o.id) : q.delete().eq(o.anahtar, o.id);
}
// Buluta yazar; internet yoksa sıraya alır (hata fırlatmaz). Diğer hatalar (yetki, eksik tablo) fırlatılır.
async function bulutYaz(o){
  if(cevrimdisi || !navigator.onLine) return kuyrugaEkle(o);
  let r; try{ r = await bulutIslem(o); }catch(e){ r = {error:e}; }
  if(r.error){ if(agHatasi(r.error)){ cevrimdisiOl(); return kuyrugaEkle(o); } throw r.error; }
}
function kuyrugaEkle(o){ kuyruk.push(Object.assign({zaman:Date.now()}, o)); IDB.yaz("kuyruk", kuyruk); durumGuncelle(); }
function cevrimdisiOl(){ if(!cevrimdisi){ cevrimdisi = true; durumGuncelle(); sessizCiz(); } }
async function kuyrukGonder(){
  if(gonderiliyor || !kuyruk.length || !navigator.onLine || !sb) return;
  gonderiliyor = true; const hatalar = [];
  try{
    while(kuyruk.length){
      const o = kuyruk[0]; let r;
      try{ r = await bulutIslem(o); }catch(e){ r = {error:e}; }
      if(r.error){
        if(agHatasi(r.error)){ cevrimdisi = true; break; }
        hatalar.push((TABLO_ADI[o.tablo] || o.tablo) + ": " + hataMesaji(r.error));
      }
      kuyruk.shift(); await IDB.yaz("kuyruk", kuyruk);
    }
    if(!kuyruk.length) cevrimdisi = false;
  } finally { gonderiliyor = false; durumGuncelle(); }
  if(hatalar.length) uyar(hatalar.length + " çevrimdışı kayıt gönderilemedi", hatalar.slice(0, 5).join("\n"));
}

}
function tcknGecerli(v){

function alanFarki(eski, yeni){

    if(typeof x === "number" && typeof y === "number" && Math.abs(x - y) < 1e-9) return;

function logla(islem, tablo, kayitId, baslik, ayrinti){
  if(logSessiz) return;
  const k = {id:yeniId(), zaman:Date.now(), kullanici:benimEposta(), ad:kullaniciGorunen(), cihaz:cihazAdi(), islem, tablo, kayit_id:String(kayitId || ""),
    baslik:String(baslik || "").slice(0, 300), ayrinti:ayrinti || {}};
  if(!cevrimici){
    try{ const l = JSON.parse(ayarOku(LOG_YEREL) || "[]"); l.unshift(k); ayarYaz(LOG_YEREL, JSON.stringify(l.slice(0, 5000))); }catch(e){}
    return;
  }
  if(!sb || eksikTablo.islem_kaydi) return;
  return bulutYaz({tip:"insert", tablo:"islem_kaydi", satirlar:k}).catch(e => { if(eksikTabloHatasi(e)) eksikTablo.islem_kaydi = 1; });
}
async function logGetir(f, bas){
  const gun = Number(f.gun) || 0, ara = (f.ara || "").toLocaleLowerCase("tr");
  if(!cevrimici){
    let l = []; try{ l = JSON.parse(ayarOku(LOG_YEREL) || "[]"); }catch(e){}
    l = l.filter(x => (!gun || x.zaman >= Date.now() - gun * 86400000) && (!f.kullanici || x.ad === f.kullanici) && (!f.islem || x.islem === f.islem) &&
      (!f.tablo || x.tablo === f.tablo) && (!ara || (x.baslik + " " + x.ad).toLocaleLowerCase("tr").indexOf(ara) >= 0));
    return l.slice(bas, bas + 100);
  }
  let q = sb.from("islem_kaydi").select("*").order("zaman", {ascending:false}).range(bas, bas + 99);
  if(gun) q = q.gte("zaman", Date.now() - gun * 86400000);
  if(f.kullanici) q = q.eq("kullanici", f.kullanici);
  if(f.islem) q = q.eq("islem", f.islem);
  if(f.tablo) q = q.eq("tablo", f.tablo);
  if(ara) q = q.ilike("baslik", "%" + ara.replace(/[%_,()\\]/g, " ") + "%");
  const r = await q;
  if(r.error){ if(eksikTabloHatasi(r.error)) eksikTablo.islem_kaydi = 1; throw r.error; }
  delete eksikTablo.islem_kaydi;
  return r.data.map(x => Object.assign(x, {zaman:Number(x.zaman)}));
}
// Saklama süresi dolan geçmiş kayıtlarını siler (en az 30 gün tutulur)
async function logTemizle(){
  const gun = Number(sistem().logGun) || 0; if(!gun || !yetki.yonetici) return;
  const sinir = Date.now() - Math.max(30, gun) * 86400000;
  if(!cevrimici){ try{ ayarYaz(LOG_YEREL, JSON.stringify(JSON.parse(ayarOku(LOG_YEREL) || "[]").filter(x => x.zaman >= sinir))); }catch(e){} return; }
  if(!eksikTablo.islem_kaydi) await sb.from("islem_kaydi").delete().lt("zaman", sinir).then(() => {}, () => {});
}

/* ================= ÇÖP KUTUSU ================= */
// Veritabanında birlikte silinen (1) veya bağı boşaltılan (0) kayıtlar
const BAGLI = {
  is_emirleri: [["is_notlari", "isEmriId", 1], ["dosyalar", "isEmriId", 1], ["faturalar", "isEmriId", 0], ["hareketler", "isEmriId", 0], ["stok_hareket", "isEmriId", 0]],
  katalog: [["katalog_gorseller", "projeId", 1]],
  personel: [["puantaj", "personelId", 1], ["personel_hareket", "personelId", 1]],
  faturalar: [["taksitler", "faturaId", 1], ["hareketler", "faturaId", 0], ["siparisler", "faturaId", 0]],
  musteriler: [["paylasimlar", "musteriId", 0], ["siparisler", "tedarikciId", 0], ["cekler", "musteriId", 0], ["cekler", "ciroId", 0]],
  hareketler: [["personel_hareket", "hareketId", 0], ["cekler", "hareketId", 0]]
};
// Geri yüklerken olması gereken üst kayıtlar
const GEREKLI = {is_emirleri:{musteriId:"musteriler"}, faturalar:{musteriId:"musteriler"}, is_notlari:{isEmriId:"is_emirleri"}, dosyalar:{isEmriId:"is_emirleri"},
  katalog_gorseller:{projeId:"katalog"}, puantaj:{personelId:"personel"}, personel_hareket:{personelId:"personel"}, taksitler:{faturaId:"faturalar"}};
const ISTEGE_BAGLI = {isEmriId:"is_emirleri", faturaId:"faturalar", musteriId:"musteriler", hareketId:"hareketler", tedarikciId:"musteriler", ciroId:"musteriler"};
const DOSYA_KAYIT = {dosyalar:1, katalog_gorseller:1};
let cop = [], copGrubu = null;
const COP_YEREL = "copKutusu";
function bagliTopla(t, k, kayitlar, kopan){
  (BAGLI[t] || []).forEach(([ct, alan, birlikte]) => (veri[ct] || []).forEach(c => {
    if(c[alan] !== k.id) return;
    if(!birlikte) kopan.push({t:ct, id:c.id, alan, deger:k.id});
    else if(!kayitlar.some(x => x.k === c)){ kayitlar.push({t:ct, k:c}); bagliTopla(ct, c, kayitlar, kopan); }
  }));
}
function copGirdisi(kayitlar, kopan, baslik){
  const ana = kayitlar[0];
  return {id:yeniId(), baslik: baslik || (TABLO_ADI[ana.t] || ana.t) + ": " + kayitBasligi(ana.t, ana.k), tur:ana.t,
    icerik:{kayitlar:JSON.parse(JSON.stringify(kayitlar)), kopan:kopan.slice()}, silen:benimEposta(), silenAd:kullaniciGorunen(), silinme:Date.now()};
}
// Birden çok silmeyi tek çöp kaydında toplar (örn. taksit planı)
async function copGrubuyla(baslik, fn){
  if(copGrubu) return fn();
  const g = copGrubu = {kayitlar:[], kopan:[]};
  try{ await fn(); }
  finally{
    copGrubu = null;
    if(g.kayitlar.length && !(await copKaydet(copGirdisi(g.kayitlar, g.kopan, baslik)).catch(() => false))) await dosyalariKaldir(g.kayitlar);
  }
}
function copYerelYaz(){ ayarYaz(COP_YEREL, JSON.stringify(cop)); }
async function copYukle(){
  if(!cevrimici){ try{ cop = JSON.parse(ayarOku(COP_YEREL) || "[]"); }catch(e){ cop = []; } return; }
  if(!yetki.yonetici){ cop = []; return; }
  const r = await sb.from("cop_kutusu").select("*").order("silinme", {ascending:false});
  if(r.error){ if(eksikTabloHatasi(r.error)) eksikTablo.cop_kutusu = 1; cop = []; return; }
  delete eksikTablo.cop_kutusu;
  cop = r.data.map(x => ({id:x.id, baslik:x.baslik, tur:x.tur, icerik:x.icerik || {}, silen:x.silen, silenAd:x.silen_ad, silinme:Number(x.silinme)}));
}
// Çöpe yazılamazsa (tablo kurulmamış) false döner; kayıt yine silinir
async function copKaydet(e){
  if(!cevrimici){ cop.unshift(e); copYerelYaz(); return true; }
  if(eksikTablo.cop_kutusu) return false;
  try{ await bulutYaz({tip:"insert", tablo:"cop_kutusu", satirlar:{id:e.id, baslik:e.baslik, tur:e.tur, icerik:e.icerik, silen:e.silen, silen_ad:e.silenAd, silinme:e.silinme}}); }
  catch(h){ if(eksikTabloHatasi(h)){ eksikTablo.cop_kutusu = 1; return false; } throw h; }
  if(yetki.yonetici) cop.unshift(e);
  return true;
}
async function copKaldir(id){
  if(cevrimici) await bulutYaz({tip:"delete", tablo:"cop_kutusu", anahtar:"id", id});
  cop = cop.filter(x => x.id !== id);
  if(!cevrimici) copYerelYaz();
}
async function dosyalariKaldir(kayitlar){
  if(!cevrimici) return;
  const yollar = kayitlar.filter(x => DOSYA_KAYIT[x.t] && x.k.yol).map(x => x.k.yol);
  if(yollar.length) await sb.storage.from(BUCKET).remove(yollar).catch(() => {});
}
const copKisaBaslik = e => (e.baslik || "").replace(/^[^:]+: /, "");
const copKalanGun = e => Math.max(0, Math.ceil((e.silinme + sistem().copGun * 86400000 - Date.now()) / 86400000));
async function copGeriYukle(e){
  const l = (e.icerik.kayitlar || []).slice().sort((a, b) => TABLOLAR.indexOf(a.t) - TABLOLAR.indexOf(b.t));
  const icinde = (t, id) => l.some(x => x.t === t && x.k.id === id);
  for(const {t, k} of l) for(const [alan, ut] of Object.entries(GEREKLI[t] || {})){
    if(!k[alan] || bul(ut, k[alan]) || icinde(ut, k[alan])) continue;
    const ust = cop.find(c => c !== e && (c.icerik.kayitlar || []).some(x => x.t === ut && x.k.id === k[alan]));
    throw new Error(ust ? "Önce “" + ust.baslik + "” geri yüklenmeli; o da çöp kutusunda." : "Bağlı olduğu " + (TABLO_ADI[ut] || ut).toLocaleLowerCase("tr") + " artık yok, bu kayıt geri yüklenemez.");
  }
  logSessiz++;
  try{
    for(const t of TABLOLAR){
      const k = l.filter(x => x.t === t).map(x => {
        const y = Object.assign({}, x.k);
        for(const [a, ut] of Object.entries(ISTEGE_BAGLI)) if(y[a] && !(GEREKLI[t] || {})[a] && !bul(ut, y[a]) && !icinde(ut, y[a])) y[a] = null;
        return y;
      });
      if(k.length) await Depo.kaydet(t, k);
    }
    for(const x of e.icerik.kopan || []){ const y = bul(x.t, x.id); if(y && !y[x.alan]) await Depo.kaydet(x.t, Object.assign({}, y, {[x.alan]:x.deger})); }
  } finally { logSessiz--; }
  await copKaldir(e.id);
  logla("geri", e.tur, l.length ? l[0].k.id : "", copKisaBaslik(e), l.length > 1 ? {"Kayıt sayısı":String(l.length)} : {});
}
async function copKaliciSil(e, neden){
  await dosyalariKaldir(e.icerik.kayitlar || []);
  await copKaldir(e.id);
  logla("kalici", e.tur, "", copKisaBaslik(e), neden ? {"Neden":neden} : {});
}
// Süresi dolanları kalıcı siler (yönetici uygulamayı açtığında)
async function copTemizle(){
  if(!yetki.yonetici) return;
  const sinir = Date.now() - sistem().copGun * 86400000;
  for(const e of cop.filter(x => x.silinme < sinir)) await copKaliciSil(e, sistem().copGun + " gün doldu").catch(() => {});
}

EYLEM.listeEkle = (btn, anahtar) => {
  let v = deger("yeni-" + anahtar); if(!v) return;
  const l = sistem()[anahtar].slice();
  if(anahtar === "kdvOranlari"){ v = sayiOku(v); if(!(v >= 0 && v <= 100)) return uyar("Oranı kontrol edin", "0 ile 100 arası bir sayı yazın."); }
  if(l.some(x => String(x).toLocaleLowerCase("tr") === String(v).toLocaleLowerCase("tr"))) return uyar("Bu zaten listede", "");
  l.push(v);
  islem(btn, async () => { await sistemKaydet({[anahtar]:l}); bildir("Eklendi"); ciz(); });
};
EYLEM.listeSil = (btn, arg) => {
  const [anahtar, i] = arg.split("|"), l = sistem()[anahtar].slice();

  const x = l.splice(Number(i), 1)[0];
