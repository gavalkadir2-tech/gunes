    (f.aciklama ? '<div class="alt-bilgi" style="margin-top:12px">Açıklama: ' + esc(f.aciklama) + '</div>' : '') +
    (!satis && f.kategori ? '<div class="alt-bilgi">Gider türü: ' + esc(f.kategori) + '</div>' : '') + '</div>' +
    '<div class="yazdirma" style="max-width:820px">' +
    '<div class="buton-sira">' + (od.kalan > 0 ? '<button class="buton" style="background:var(--' + (satis ? "giris" : "cikis") + ')" data-git="' + (satis ? "giris" : "cikis") + '/' + f.musteriId + '/' + (f.isEmriId || "-") + '/' + f.id + '">' +
      ik(satis ? "asagi" : "yukari") + (satis ? "Tahsilat al" : "Ödeme yap") + '</button>' : '') +
      '<button class="buton ikincil" onclick="window.print()">' + ik("yazdir") + 'Yazdır</button><button class="buton wa-buton" data-is="waFatura" data-arg="' + id + '">' + ik("mesaj") + 'WhatsApp</button></div>' +
    (odemeler.length ? bolum("Bu faturanın ödemeleri") + '<div class="kart liste-kart">' + odemeler.map(h => hareketSatir(h, true)).join("") + '</div>' : '') +
    '<div class="alt-bilgi" style="margin:12px 2px">Bu belge işletme içi kayıttır; resmî e-Fatura/e-Arşiv yerine geçmez.</div>' +
    '<button class="buton tehlike" data-is="faturaSil" data-arg="' + id + '">' + ik("sil") + 'Faturayı sil</button></div>';
  return {baslik:(satis ? "Satış" : "Alış") + " faturası " + f.no, geri:true, html};
}
EYLEM.faturaSil = (el, id) => {
  const n = veri.hareketler.filter(h => h.faturaId === id).length;
  onayla("Fatura silinsin mi?", n ? "Bu faturaya bağlı " + n + " ödeme kaydı silinmez, carinin hesabında kalır." : "Bu işlem geri alınamaz.", "Sil",
    () => islem(null, async () => {
      await Depo.sil("faturalar", id);
      veri.hareketler.forEach(h => { if(h.faturaId === id) h.faturaId = null; });
      if(!cevrimici) yerelYaz(veri);
      bildir("Fatura silindi"); geri();
    }));
};

/* ================= RAPOR ================= */
function ekranRapor(){
  let gir = 0, cik = 0, fSatis = 0, fAlis = 0, kdvS = 0, kdvA = 0;
  const giderler = {}, gelirler = {}, musteriSatis = {};
  veri.hareketler.forEach(h => {
    if(h.tarih.slice(0, 7) !== ayGoster) return;
    if(h.tur === "giris"){ gir += h.tutar; gelirler[h.kategori] = (gelirler[h.kategori] || 0) + h.tutar; }
    else if(h.tur === "cikis"){ cik += h.tutar; giderler[h.kategori] = (giderler[h.kategori] || 0) + h.tutar; }
  });
  veri.faturalar.forEach(f => {
    if(f.tarih.slice(0, 7) !== ayGoster) return;
    if(f.tur === "satis"){ fSatis += f.toplam; kdvS += f.kdvToplam; const a = cariAdi(f.musteriId); musteriSatis[a] = (musteriSatis[a] || 0) + f.toplam; }
    else { fAlis += f.toplam; kdvA += f.kdvToplam; }
  });
  let alacak = 0, borc = 0; veri.musteriler.forEach(m => { const b = cariBakiye(m.id); if(b > 0) alacak += b; else borc -= b; });
  const html = '<div class="ust-arac">' + aySecici() + '</div>' +
    '<div class="izgara uc"><div class="kart"><div class="kart-baslik">' + (gir - cik >= 0 ? "Kasada bu ay kalan" : "Bu ay çıkan, girenden fazla") + '</div>' +
      '<div class="buyuk-sayi ' + (gir - cik >= 0 ? "t-giris" : "t-cikis") + '" style="font-size:24px">' + para(gir - cik) + '</div></div>' +
      '<div class="kart ozet"><div class="kart-baslik">Kasaya giren</div><div class="deger t-giris">' + para(gir) + '</div></div>' +
      '<div class="kart ozet"><div class="kart-baslik">Kasadan çıkan</div><div class="deger t-cikis">' + para(cik) + '</div></div></div>' +
    '<div class="izgara dort"><div class="kart ozet"><div class="kart-baslik">Satış faturaları</div><div class="deger">' + para(fSatis) + '</div><div class="alt-bilgi">KDV ' + para(kdvS) + '</div></div>' +
      '<div class="kart ozet"><div class="kart-baslik">Alış faturaları</div><div class="deger">' + para(fAlis) + '</div><div class="alt-bilgi">KDV ' + para(kdvA) + '</div></div>' +
      '<div class="kart ozet"><div class="kart-baslik">Toplam alacak</div><div class="deger t-borc">' + para(alacak) + '</div><div class="alt-bilgi">Bugün itibarıyla</div></div>' +
      '<div class="kart ozet"><div class="kart-baslik">Toplam borç</div><div class="deger t-cikis">' + para(borc) + '</div><div class="alt-bilgi">Bugün itibarıyla</div></div></div>' +
    '<div class="iki-sutun">' + cubuklar("Para nereye gitti?", giderler, cik, "var(--cikis)") + cubuklar("Para nereden geldi?", gelirler, gir, "var(--giris)") + '</div>' +
    cubuklar("En çok satış yapılan müşteriler", musteriSatis, fSatis, "var(--borc)", 8);
  return {baslik:"Rapor", html};
}
function cubuklar(baslik, obj, toplam, renk, sinir){
  const anahtar = Object.keys(obj).sort((a, b) => obj[b] - obj[a]).slice(0, sinir || 99);
  const govde = !anahtar.length ? '<div class="bos" style="padding:16px">Bu ay kayıt yok.</div>' : anahtar.map(k => {
    const yuzde = toplam ? Math.round(obj[k] / toplam * 100) : 0;
    return '<div class="cubuk-satir" title="' + esc(k) + ': ' + para(obj[k]) + '"><div class="cubuk-ust"><span>' + esc(k) + '</span><span style="white-space:nowrap">' + para(obj[k]) +
      ' <span class="t-soluk" style="font-size:13px">· %' + yuzde + '</span></span></div><div class="cubuk-yol"><div class="cubuk" style="width:' +
      Math.max(obj[k] / obj[anahtar[0]] * 100, 2) + '%;background:' + renk + '"></div></div></div>';
  }).join("");
  return '<div class="kart"><div class="kart-baslik" style="font-size:14px;color:var(--yazi);font-weight:600">' + baslik + '</div>' + govde + '</div>';
}

/* ================= AYARLAR ================= */
function ekranAyarlar(){
  const son = Number(ayarOku("sonYedek")), eski = cevrimici ? yerelOku() : null;
  const katKart = (tur, baslik) => '<div class="kart"><div class="kart-baslik" style="font-size:14px;color:var(--yazi);font-weight:600">' + baslik + '</div>' +
    '<div class="kategori-liste">' + kategoriler(tur).map((k, i) => '<span>' + esc(k) + '<button data-is="katSil" data-arg="' + tur + '|' + i + '" aria-label="Sil">' + ik("x") + '</button></span>').join("") + '</div>' +
    '<div class="buton-sira" style="flex-wrap:nowrap"><input id="yeniKat-' + tur + '" class="kutu" maxlength="40" placeholder="Yeni kategori adı"><button class="buton kucuk" data-is="katEkle" data-arg="' + tur + '">' + ik("arti") + 'Ekle</button></div></div>';
  let html = '<div class="iki-sutun"><div>';
  if(cevrimici){
    html += '<div class="kart"><div class="kart-baslik">Hesap</div><div style="font-weight:500">' + esc(kullaniciAdi()) + '</div>' +
      '<div class="alt-bilgi">Bilgiler bulutta saklanıyor; telefon ve bilgisayarda aynı bilgiler görünür.</div>' +
      '<button class="buton ikincil" data-is="cikisYap">' + ik("cikis") + 'Çıkış yap</button></div>';
    if(TABLOLAR.some(t => t !== "ayarlar" && eski[t].length))
      html += '<div class="kart"><div class="kart-baslik">Bu cihazdaki eski kayıtlar</div><div>Bu cihazda bulut öncesinden kalan <b>' + eski.hareketler.length + ' kayıt</b> ve <b>' + eski.musteriler.length + ' cari</b> var.</div>' +
        '<div class="hata" id="hata"></div><button class="buton" data-is="buluttaAktar">' + ik("bulut") + 'Buluta aktar</button></div>';
  } else html += '<div class="uyari">Bilgiler şu an <b>sadece bu cihazda</b> saklanıyor.</div>';
  html += '<div class="kart"><div class="kart-baslik">Yedek</div><div>Tüm bilgileri bir dosya olarak indirir.</div>' +
    '<div class="alt-bilgi">Son yedek: <b>' + (son ? tarihYaz(tarihStr(new Date(son))) : "Hiç alınmadı") + '</b></div>' +
    '<div class="buton-sira" style="margin-top:16px"><button class="buton" data-is="yedekAl">' + ik("indir") + 'Yedek al</button>' +
    '<button class="buton ikincil" onclick="document.getElementById(\'yedekDosya\').click()">' + ik("yukle") + 'Geri yükle</button></div>' +
    '<input type="file" id="yedekDosya" accept=".json,application/json" style="display:none" onchange="yedekYukle(this)"></div>' +
    '<div class="kart">' + bilgiSatir("Cari", veri.musteriler.length) + bilgiSatir("İş emri", veri.is_emirleri.length) + bilgiSatir("Fatura", veri.faturalar.length) + bilgiSatir("Kasa hareketi", veri.hareketler.length) + '</div>' +
    '</div><div>' + katKart("giris", "Gelir kategorileri") + katKart("cikis", "Gider kategorileri") +
    '<button class="buton ikincil" data-is="katSifirla">Kategorileri varsayılana döndür</button></div></div>';
  return {baslik:"Ayarlar", geri: matchMedia("(max-width:899px)").matches, html};
}
async function kategoriKaydet(tur, liste){
  const mevcut = {giris:kategoriler("giris"), cikis:kategoriler("cikis")};
  mevcut[tur] = liste;
  await Depo.kaydet("ayarlar", {anahtar:"kategoriler", deger:mevcut});
}
EYLEM.katEkle = (btn, tur) => {
  const ad = deger("yeniKat-" + tur); if(!ad) return;
  const l = kategoriler(tur).slice();
  if(l.some(x => x.toLocaleLowerCase("tr") === ad.toLocaleLowerCase("tr"))) return uyar("Bu kategori zaten var", "");
  l.push(ad);
  islem(btn, async () => { await kategoriKaydet(tur, l); bildir("Kategori eklendi"); ciz(); });
};
EYLEM.katSil = (btn, arg) => {
  const [tur, i] = arg.split("|"), l = kategoriler(tur).slice();
  if(l.length <= 1) return uyar("En az bir kategori kalmalı", "");
  const ad = l.splice(Number(i), 1)[0];
  onayla("“" + ad + "” silinsin mi?", "Eski kayıtlardaki kategori adı değişmez.", "Sil", () => islem(null, async () => { await kategoriKaydet(tur, l); ciz(); }));
};
EYLEM.katSifirla = () => onayla("Kategoriler varsayılana dönsün mü?", "Eklediğiniz kategoriler listeden kalkar; eski kayıtlar etkilenmez.", "Döndür",
  () => islem(null, async () => { await Depo.kaydet("ayarlar", {anahtar:"kategoriler", deger:VARSAYILAN_KATEGORI}); bildir("Kategoriler sıfırlandı"); ciz(); }));

EYLEM.yedekAl = () => {
  const v = {surum:2, tarih:new Date().toISOString()}; TABLOLAR.forEach(t => { if(t !== "dosyalar") v[t] = veri[t]; });
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(v, null, 1)], {type:"application/json"}));
  a.download = "gunes-mobilya-yedek-" + bugun() + ".json"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  ayarYaz("sonYedek", Date.now()); bildir("Yedek dosyası indirildi"); ciz();
};
function yedekGecerli(v){
  return v && Array.isArray(v.hareketler) && Array.isArray(v.musteriler) &&
    v.hareketler.every(h => h && typeof h.id === "string" && /^(giris|cikis|borc)$/.test(h.tur) && Number(h.tutar) > 0 && /^\d{4}-\d{2}-\d{2}$/.test(h.tarih)) &&
    v.musteriler.every(m => m && typeof m.id === "string" && typeof m.ad === "string") &&
    (v.faturalar || []).every(f => f && typeof f.id === "string" && /^(satis|alis)$/.test(f.tur)) &&
    (v.is_emirleri || []).every(i => i && typeof i.id === "string" && typeof i.baslik === "string");
}
async function hepsiniKaydet(v){
  for(const t of TABLOLAR) await Depo.kaydet(t, v[t]);
}
function yedekYukle(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let v; try{ v = JSON.parse(r.result); }catch(e){}
    input.value = "";
    if(!yedekGecerli(v)) return uyar("Bu dosya bir yedek dosyası değil", "");
    v = duzenle(v);
    v.hareketler.forEach(h => { h.tutar = Number(h.tutar); });
    const yazi = cevrimici ? "Yedekteki kayıtlar buluta eklenecek; aynı kayıtlar varsa üzerine yazılır." : "Bu cihazdaki bilgilerin yerine yedekteki bilgiler gelecek.";
    onayla(v.hareketler.length + " kasa kaydı, " + v.faturalar.length + " fatura ve " + v.musteriler.length + " cari yüklensin mi?", yazi, "Yükle", () =>
      islem(null, async () => { if(!cevrimici) veri = bosVeri(); await hepsiniKaydet(v); bildir("Yedek yüklendi"); git("ana"); }), false);
  };
  r.readAsText(f);
}
EYLEM.buluttaAktar = btn => islem(btn, async () => {
  await hepsiniKaydet(yerelOku());
  try{ localStorage.removeItem(YEREL_ANAHTAR); }catch(e){}
  bildir("Eski kayıtlar buluta aktarıldı"); ciz();
});

/* ================= GİRİŞ ================= */
// Kullanıcı adı yazılırsa arkada "ad@gunesmobilya.app" e-postasına çevrilir.
const epostaYap = ad => { ad = ad.trim().toLocaleLowerCase("tr"); return ad.indexOf("@") >= 0 ? ad : ad + "@gunesmobilya.app"; };
const kullaniciAdi = () => ((oturum && oturum.user && oturum.user.email) || "").replace("@gunesmobilya.app", "");
function girisEkrani(mesaj){
  document.body.classList.add("girissiz");
  document.getElementById("uygulama").innerHTML =
    '<div class="giris-ekrani"><form class="kart" id="girisForm">' +
      '<div class="logo"><span class="gunes">' + ik("gunes") + '</span>Güneş Mobilya</div>' +
      '<div class="alt-bilgi" style="text-align:center;margin-bottom:8px">Muhasebe</div>' +
      '<label class="etiket" for="kadi">Kullanıcı adı</label><input id="kadi" class="kutu" autocomplete="username" autocapitalize="none" required>' +
      '<label class="etiket" for="sifre">Şifre</label><input id="sifre" type="password" class="kutu" autocomplete="current-password" required>' +
      '<div class="hata" id="hata">' + esc(mesaj || "") + '</div>' +
      '<button class="buton" type="submit" id="girisBtn">Giriş yap</button></form></div>';
  document.getElementById("girisForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("girisBtn");
    btn.disabled = true; btn.textContent = "Giriş yapılıyor…";
    const r = await sb.auth.signInWithPassword({email:epostaYap(deger("kadi")), password:document.getElementById("sifre").value});
    if(r.error){
      btn.disabled = false; btn.textContent = "Giriş yap";
      return hataYaz(/invalid/i.test(r.error.message) ? "Kullanıcı adı veya şifre yanlış." : hataMesaji(r.error));
    }
    oturum = r.data.session; acilis();
  });
  document.getElementById("kadi").focus();
}
EYLEM.cikisYap = () => onayla("Çıkış yapılsın mı?", "", "Çıkış yap", async () => {
  await sb.auth.signOut(); oturum = null; hazir = false; veri = bosVeri();
  history.replaceState(null, "", "#ana"); girisEkrani();
});

/* ================= AÇILIŞ & CANLI GÜNCELLEME ================= */
async function acilis(){
  document.getElementById("uygulama").innerHTML = '<div class="yukleniyor"><span class="donen"></span>Yükleniyor…</div>';
  try{ await Depo.yukle(); }
  catch(e){
    if(/JWT/i.test(e.message || "")) return girisEkrani("Oturum süresi doldu, tekrar giriş yapın.");
    document.body.classList.add("girissiz");
    document.getElementById("uygulama").innerHTML = '<div class="giris-ekrani"><div class="kart" style="text-align:center"><p>' + esc(hataMesaji(e)) + '</p>' +
      '<button class="buton" onclick="acilis()">Tekrar dene</button></div></div>';
    return;
  }
  hazir = true; ciz();
  if(cevrimici) canliBaglan();
}
let kanal = null, yenileZamanlayici = null;
function canliBaglan(){
  if(kanal) return;
  kanal = sb.channel("degisiklikler");
  TABLOLAR.forEach(t => kanal.on("postgres_changes", {event:"*", schema:"public", table:t}, p => {
    const id = anahtarAdi(t);
    if(p.eventType === "DELETE") veri[t] = veri[t].filter(x => x[id] !== p.old[id]);
    else bellegeYaz(t, buluttanCevir(t, p.new));
    sessizCiz();
  }));
  kanal.subscribe();
}
// Kullanıcı form dolduruyorsa ekranı yenileme, yazdığı kaybolmasın.
function sessizCiz(){
  clearTimeout(yenileZamanlayici);
  yenileZamanlayici = setTimeout(() => {
    if(!hazir || FORM_EKRANLARI[yol()[0]] || document.querySelector(".perde, .lb")) return;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName)){ yenileZamanlayici = setTimeout(sessizCiz, 4000); return; }   // yazı yazılıyorsa sonra dene
    const y = window.scrollY; ciz(); window.scrollTo(0, y);
  }, 250);
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible" || !cevrimici || !hazir) return;
  Depo.yukle().then(sessizCiz).catch(() => {});
});

(async () => {
  if(!cevrimici) return acilis();
  if(!sb){
    document.body.classList.add("girissiz");
    document.getElementById("uygulama").innerHTML = '<div class="giris-ekrani"><div class="kart" style="text-align:center"><p>İnternet bağlantısı yok gibi görünüyor.</p>' +
      '<button class="buton" onclick="location.reload()">Tekrar dene</button></div></div>';
    return;
  }
  const r = await sb.auth.getSession();
  oturum = r.data.session;
  sb.auth.onAuthStateChange((olay, s) => { oturum = s; if(olay === "SIGNED_OUT" && hazir){ hazir = false; girisEkrani(); } });
  if(oturum) acilis(); else girisEkrani();
})();
</script>
